
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRA CLOCK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* توهج هادئ جداً في الخلفية */
        .bg-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, rgba(15, 23, 42, 0) 70%);
            filter: blur(80px);
            z-index: -1;
        }

        /* المربع الزجاجي المطلوب */
        .glass-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        /* أيقونة الساعة داخل المربع */
        .clock-icon-inner {
            width: 60px;
            height: 60px;
            border: 3px solid #38bdf8;
            border-radius: 50%;
            position: relative;
            margin-bottom: 20px;
        }

        .clock-icon-inner::after {
            content: '';
            position: absolute;
            width: 3px;
            height: 20px;
            background: #38bdf8;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            transform-origin: bottom;
            animation: rotateHand 60s linear infinite;
        }

        @keyframes rotateHand {
            from { transform: translateX(-50%) rotate(0deg); }
            to { transform: translateX(-50%) rotate(360deg); }
        }

        .digital-time {
            font-size: 4rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }

        .btn-back {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 25px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- المربع الزجاجي وبداخله الساعة -->
    <div class="glass-box">
        <div class="clock-icon-inner"></div>
        <div id="time" class="digital-time">00:00</div>
        <div id="date" class="opacity-50 mt-2">التاريخ اليوم</div>
        
        <button onclick="window.history.back()" class="btn-back text-sm">
            الرجوع للمصفوفة
        </button>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            
            document.getElementById('time').innerText = `${h}:${m}`;
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString('ar-SA', options);
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
