<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra Clock - مؤقت وكرونومتر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #6366f1;
            --bg-gradient: radial-gradient(circle at top right, #1e1b4b, #000);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.08);
            --accent-glow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body { 
            background: var(--bg-gradient); 
            background-attachment: fixed; 
            min-height: 100vh; 
            font-family: 'Tajawal', sans-serif;
            color: white;
            margin: 0;
            overflow-x: hidden;
        }
        
        .glass-card { 
            background: var(--glass); 
            backdrop-filter: blur(20px) saturate(160%); 
            border: 1px solid var(--border); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s ease-out forwards;
        }

        .timer-display {
            font-family: 'Inter', sans-serif;
            font-variant-numeric: tabular-nums; /* يمنع اهتزاز الأرقام أثناء العد */
            font-size: 4rem;
            font-weight: 900;
            direction: ltr;
            display: inline-block;
            background: linear-gradient(135deg, #fff, var(--primary-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 15px rgba(99, 102, 241, 0.3));
        }

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            position: absolute;
            bottom: 0;
            right: 0;
            border-radius: 0 0 2rem 2rem;
            overflow: hidden;
        }

        .progress-bar-bg {
            height: 100%;
            background: var(--primary-color);
            transition: width 0.3s linear;
            box-shadow: var(--accent-glow);
        }

        .task-item {
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
        }

        .task-item:hover {
            background: var(--glass-hover);
            transform: scale(1.02);
        }

        .btn-action {
            transition: all 0.2s ease;
        }
        .btn-action:active { transform: scale(0.95); }

        .time-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 0.5rem;
            text-align: center;
            color: white;
            outline: none;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.3); border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <header class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6 mb-10">
        <div class="flex items-center gap-6">
            <button onclick="window.history.back()" class="p-3 glass-card rounded-2xl hover:bg-white/10 transition-all group">
                <svg class="w-6 h-6 text-indigo-400 group-hover:translate-x-1 transition-transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
            </button>
            <div>
                <h1 class="text-4xl font-black tracking-tight" style="color: var(--primary-color);">ASTRA CLOCK</h1>
                <p class="text-[10px] opacity-40 tracking-[0.2em] font-bold uppercase mt-1">تطبيقات الوقت والأداء المتقدمة</p>
            </div>
        </div>
        
        <div class="flex gap-4">
            <div class="glass-card py-3 px-6 rounded-[2rem] hidden md:block">
                <div class="text-center">
                    <p class="text-[10px] opacity-40 tracking-widest uppercase">المهام المنجزة</p>
                    <p id="taskStats" class="text-xl font-bold text-indigo-400">0</p>
                </div>
            </div>
            <div class="glass-card py-3 px-6 rounded-[2rem]">
                <div class="text-center">
                    <p class="text-[10px] opacity-40 tracking-widest uppercase">الوقت الحالي</p>
                    <p id="currentTime" class="text-xl font-mono font-bold" style="direction: ltr;">00:00:00</p>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto space-y-8">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="glass-card p-6 rounded-[2rem] relative overflow-hidden">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-black flex items-center gap-2 text-indigo-400">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        مؤقت تنازلي
                    </h3>
                    <div class="flex gap-2">
                        <button onclick="setQuickTimer(300)" class="text-xs px-3 py-1 rounded-full bg-white/5 hover:bg-white/10 border border-white/5">5 د</button>
                        <button onclick="setQuickTimer(1500)" class="text-xs px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">25 د</button>
                    </div>
                </div>
                
                <div class="text-center mb-6 relative">
                    <div id="timerDisplay" class="timer-display text-6xl md:text-8xl mb-4">00:00:00</div>
                    
                    <div class="flex flex-wrap justify-center gap-3 mt-8">
                        <div class="flex gap-2 bg-black/20 p-2 rounded-2xl border border-white/5" dir="ltr">
                            <input type="number" id="timerMinutes" placeholder="MM" class="time-input w-16" value="0" min="0">
                            <span class="flex items-center">:</span>
                            <input type="number" id="timerSeconds" placeholder="SS" class="time-input w-16" value="0" min="0" max="59">
                        </div>
                        <button onclick="startTimer()" id="timerStartBtn" class="btn-action px-6 py-3 rounded-2xl font-bold bg-indigo-600 hover:bg-indigo-500">▶ بدء</button>
                        <button onclick="stopTimer()" class="btn-action px-6 py-3 rounded-2xl font-bold bg-red-600/50 hover:bg-red-600">⏸ إيقاف</button>
                        <button onclick="resetTimer()" class="btn-action px-6 py-3 rounded-2xl font-bold bg-white/10 hover:bg-white/20">↺ إعادة</button>
                    </div>
                </div>
                <div class="progress-bar-container">
                    <div id="timerProgressBar" class="progress-bar-bg" style="width: 0%"></div>
                </div>
            </div>

            <div class="glass-card p-6 rounded-[2rem]">
                <h3 class="text-xl font-black flex items-center gap-2 mb-6 text-emerald-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    كرونومتر متقدم
                </h3>
                
                <div class="text-center mb-6">
                    <div id="stopwatchDisplay" class="timer-display text-6xl md:text-8xl mb-4">00:00:00</div>
                    <div class="flex flex-wrap justify-center gap-3">
                        <button onclick="startStopwatch()" class="btn-action px-8 py-3 rounded-2xl font-bold bg-emerald-600 hover:bg-emerald-500">▶ بدء</button>
                        <button onclick="stopStopwatch()" class="btn-action px-8 py-3 rounded-2xl font-bold bg-red-600/50 hover:bg-red-600">⏸ إيقاف</button>
                        <button onclick="recordLap()" class="btn-action px-6 py-3 rounded-2xl font-bold bg-white/10 hover:bg-white/20">🏁 دورة</button>
                        <button onclick="resetStopwatch()" class="btn-action px-6 py-3 rounded-2xl font-bold bg-white/5 hover:bg-white/10">↺ تصفير</button>
                    </div>
                </div>
                <div id="lapsContainer" class="mt-4 max-h-32 overflow-y-auto custom-scrollbar space-y-1"></div>
            </div>
        </div>

        <div class="glass-card p-6 rounded-[2rem]">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-black flex items-center gap-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                    </svg>
                    المهام المجدولة
                </h3>
                <button onclick="openAddTaskModal()" class="btn-action px-4 py-2 rounded-xl bg-indigo-600 text-sm font-bold">+ إضافة</button>
            </div>
            <div id="tasksList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
            <div id="noTasks" class="text-center py-8 opacity-40">لا توجد مهام حالياً</div>
        </div>
    </main>

    <div id="taskModal" class="fixed inset-0 bg-black/90 backdrop-blur-xl z-50 hidden items-center justify-center p-4">
        <div class="glass-card p-8 rounded-[2.5rem] max-w-md w-full border-white/20">
            <h3 class="text-2xl font-black mb-6">إضافة مهمة جديدة</h3>
            <div class="space-y-4">
                <input type="text" id="newTaskName" class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 outline-none" placeholder="اسم المهمة...">
                <div class="grid grid-cols-2 gap-4" dir="ltr">
                    <div class="text-center"><p class="text-[10px] mb-1 opacity-50">دقائق</p><input type="number" id="newTaskMinutes" class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-center" value="25"></div>
                    <div class="text-center"><p class="text-[10px] mb-1 opacity-50">ثواني</p><input type="number" id="newTaskSeconds" class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-center" value="0"></div>
                </div>
                <button onclick="addCustomTask()" class="w-full bg-indigo-600 py-4 rounded-2xl font-bold">حفظ المهمة</button>
                <button onclick="closeTaskModal()" class="w-full text-sm opacity-50">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        let timerInterval = null, timerSecondsLeft = 0, timerTotalInitial = 0, isTimerRunning = false;
        let stopwatchInterval = null, stopwatchSeconds = 0, isStopwatchRunning = false, stopwatchLaps = [];
        let customTasks = JSON.parse(localStorage.getItem('astra_clock_tasks')) || [];
        let completedCount = parseInt(localStorage.getItem('astra_completed_count')) || 0;

        function updateCurrentTime() {
            const now = new Date();
            document.getElementById('currentTime').innerText = now.toLocaleTimeString('en-GB', { hour12: false });
        }
        setInterval(updateCurrentTime, 1000);

        function updateTimerDisplay() {
            const h = Math.floor(timerSecondsLeft / 3600), 
                  m = Math.floor((timerSecondsLeft % 3600) / 60), 
                  s = timerSecondsLeft % 60;
            document.getElementById('timerDisplay').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            
            const progress = timerTotalInitial > 0 ? (timerSecondsLeft / timerTotalInitial) * 100 : 0;
            document.getElementById('timerProgressBar').style.width = `${progress}%`;
        }

        function startTimer() {
            if (isTimerRunning) return;
            if (timerSecondsLeft === 0) {
                const m = parseInt(document.getElementById('timerMinutes').value) || 0;
                const s = parseInt(document.getElementById('timerSeconds').value) || 0;
                timerSecondsLeft = (m * 60) + s;
                timerTotalInitial = timerSecondsLeft;
            }
            if (timerSecondsLeft <= 0) return;
            isTimerRunning = true;
            document.getElementById('timerStartBtn').innerText = "▶ جاري";
            timerInterval = setInterval(() => {
                if (timerSecondsLeft > 0) { 
                    timerSecondsLeft--; 
                    updateTimerDisplay(); 
                } else { 
                    stopTimer(); 
                    completedCount++; 
                    updateStats(); 
                    alert("انتهى الوقت!"); 
                }
            }, 1000);
        }

        function stopTimer() { 
            clearInterval(timerInterval); 
            isTimerRunning = false; 
            document.getElementById('timerStartBtn').innerText = "▶ بدء";
        }

        function resetTimer() { 
            stopTimer(); 
            timerSecondsLeft = 0; 
            timerTotalInitial = 0;
            updateTimerDisplay(); 
        }

        function setQuickTimer(s) { 
            stopTimer(); 
            timerSecondsLeft = s; 
            timerTotalInitial = s; 
            updateTimerDisplay(); 
        }

        function startStopwatch() {
            if (isStopwatchRunning) return;
            isStopwatchRunning = true;
            stopwatchInterval = setInterval(() => {
                stopwatchSeconds++;
                const h = Math.floor(stopwatchSeconds/3600), 
                      m = Math.floor((stopwatchSeconds%3600)/60), 
                      s = stopwatchSeconds%60;
                document.getElementById('stopwatchDisplay').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }, 1000);
        }

        function stopStopwatch() { clearInterval(stopwatchInterval); isStopwatchRunning = false; }
        function resetStopwatch() { stopStopwatch(); stopwatchSeconds = 0; document.getElementById('stopwatchDisplay').innerText = "00:00:00"; stopwatchLaps = []; renderLaps(); }
        function recordLap() { if(stopwatchSeconds > 0) { stopwatchLaps.unshift(document.getElementById('stopwatchDisplay').innerText); renderLaps(); } }

        function renderLaps() {
            document.getElementById('lapsContainer').innerHTML = stopwatchLaps.map((l, i) => `
                <div class="flex justify-between p-2 border-b border-white/5 text-xs">
                    <span>دورة ${stopwatchLaps.length - i}</span>
                    <span class="font-mono text-emerald-400">${l}</span>
                </div>`).join('');
        }

        function addCustomTask() {
            const name = document.getElementById('newTaskName').value;
            const m = parseInt(document.getElementById('newTaskMinutes').value) || 0;
            const s = parseInt(document.getElementById('newTaskSeconds').value) || 0;
            if(!name) return;
            customTasks.push({ id: Date.now(), name, seconds: (m*60)+s });
            localStorage.setItem('astra_clock_tasks', JSON.stringify(customTasks));
            renderTasksList();
            closeTaskModal();
            document.getElementById('newTaskName').value = "";
        }

        function deleteCustomTask(id, e) {
            e.stopPropagation();
            customTasks = customTasks.filter(t => t.id !== id);
            localStorage.setItem('astra_clock_tasks', JSON.stringify(customTasks));
            renderTasksList();
        }

        function renderTasksList() {
            const container = document.getElementById('tasksList');
            document.getElementById('noTasks').style.display = customTasks.length ? 'none' : 'block';
            container.innerHTML = customTasks.map(t => `
                <div class="task-item p-4 rounded-2xl flex justify-between items-center" onclick="setQuickTimer(${t.seconds})">
                    <div>
                        <p class="font-bold text-sm">${t.name}</p>
                        <p class="text-[10px] opacity-50">${Math.floor(t.seconds/60)} دقيقة</p>
                    </div>
                    <button onclick="deleteCustomTask(${t.id}, event)" class="text-red-400 hover:scale-125 transition-transform p-2">✕</button>
                </div>`).join('');
        }

        function updateStats() { 
            document.getElementById('taskStats').innerText = completedCount; 
            localStorage.setItem('astra_completed_count', completedCount); 
        }

        function openAddTaskModal() { document.getElementById('taskModal').style.display = 'flex'; }
        function closeTaskModal() { document.getElementById('taskModal').style.display = 'none'; }

        // تهيئة عند التشغيل
        updateCurrentTime();
        renderTasksList();
        updateStats();
    </script>
</body>
</html>
