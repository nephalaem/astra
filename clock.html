<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astra Clock - مؤقت وكرونومتر</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
/* نفس التنسيقات بدون تغيير */
:root {
--primary-color:#6366f1;
--bg-gradient:radial-gradient(circle at top right,#1e1b4b,#000);
--glass:rgba(255,255,255,0.03);
--glass-hover:rgba(255,255,255,0.08);
--border:rgba(255,255,255,0.08);
--accent-glow:0 0 20px rgba(99,102,241,0.4);
}
body{background:var(--bg-gradient);min-height:100vh;font-family:'Tajawal','Inter',sans-serif;color:white;margin:0}
.glass-card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--border)}
.task-item{cursor:pointer}
</style>
</head>

<body>

<!-- كل الواجهة نفسها بدون تغيير -->
<!-- (اختصرت الجزء العلوي لأنه بدون تعديل) -->

<!-- 🆕 نافذة تعديل -->
<div id="editModal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50" onclick="closeEditModal(event)">
<div class="glass-card p-6 rounded-2xl w-[90%] max-w-md" onclick="event.stopPropagation()">

<h3 class="text-xl font-bold mb-4">تعديل المهمة ⚙️</h3>

<input id="editName" class="w-full mb-3 p-3 rounded bg-black/30" placeholder="اسم المهمة">

<div class="flex gap-2 mb-3">
<input id="editMin" type="number" class="w-1/2 p-3 rounded bg-black/30" placeholder="دقائق">
<input id="editSec" type="number" class="w-1/2 p-3 rounded bg-black/30" placeholder="ثواني">
</div>

<select id="editRecurring" class="w-full p-3 rounded bg-black/30 mb-4">
<option value="none">بدون</option>
<option value="daily">يومي</option>
<option value="weekly">أسبوعي</option>
</select>

<button onclick="saveEdit()" class="w-full bg-indigo-600 p-3 rounded">💾 حفظ</button>

</div>
</div>

<script>

// نفس المتغيرات
let customTasks = JSON.parse(localStorage.getItem('astra_clock_tasks')) || [];
let editingId = null;

// 🗑️ حذف مع تأكيد
function deleteCustomTask(id,e){
e.stopPropagation();
if(!confirm("⚠️ هل تريد حذف المهمة؟")) return;
customTasks = customTasks.filter(t=>t.id!==id);
localStorage.setItem('astra_clock_tasks',JSON.stringify(customTasks));
renderTasksList();
}

// ⚙️ فتح نافذة التعديل
function editCustomTask(id,e){
e.stopPropagation();
const task = customTasks.find(t=>t.id===id);
if(!task) return;

editingId = id;

document.getElementById('editName').value = task.name;
document.getElementById('editMin').value = Math.floor(task.seconds/60);
document.getElementById('editSec').value = task.seconds%60;
document.getElementById('editRecurring').value = task.recurring;

document.getElementById('editModal').style.display='flex';
}

// 💾 حفظ التعديل
function saveEdit(){
const task = customTasks.find(t=>t.id===editingId);
if(!task) return;

const name = document.getElementById('editName').value;
const min = parseInt(document.getElementById('editMin').value)||0;
const sec = parseInt(document.getElementById('editSec').value)||0;
const rec = document.getElementById('editRecurring').value;

const total = min*60+sec;
if(!name || total<=0){alert("❌ بيانات غير صحيحة");return;}

task.name=name;
task.seconds=total;
task.recurring=rec;

localStorage.setItem('astra_clock_tasks',JSON.stringify(customTasks));
closeEditModal();
renderTasksList();
}

// ❌ إغلاق
function closeEditModal(e){
if(e && e.target!==e.currentTarget) return;
document.getElementById('editModal').style.display='none';
}

// 🔁 عرض المهام (عدلنا الأزرار فقط)
function renderTasksList(){
const container=document.getElementById('tasksList');
if(!container) return;

container.innerHTML=customTasks.map(task=>{
const m=Math.floor(task.seconds/60);
const s=task.seconds%60;

return `
<div class="task-item p-3 bg-white/5 rounded" onclick="startTaskWithTime(${task.seconds},'${task.name}')">

<div class="flex justify-between">
<span>${task.name}</span>

<div class="flex gap-2">
<button onclick="editCustomTask(${task.id},event)">⚙️</button>
<button onclick="deleteCustomTask(${task.id},event)">🗑️</button>
</div>

</div>

<div class="text-xs opacity-60">${m}:${String(s).padStart(2,'0')}</div>

</div>
`;
}).join('');
}

renderTasksList();

</script>

</body>
</html>
