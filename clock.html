<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra Clock - مؤقت وكرونومتر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #6366f1;
            --bg-gradient: radial-gradient(circle at top right, #1e1b4b, #000);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.08);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes ring {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        body { 
            background: var(--bg-gradient); 
            background-attachment: fixed; 
            min-height: 100vh; 
            font-family: 'Tajawal', 'Inter', sans-serif;
            color: white;
            margin: 0;
            overflow-x: hidden;
        }
        
        .glass-card { 
            background: var(--glass); 
            backdrop-filter: blur(20px) saturate(160%); 
            border: 1px solid var(--border); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s ease-out forwards;
        }

        .timer-display {
            font-family: 'Inter', monospace;
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 0.1em;
            background: linear-gradient(135deg, #fff, var(--primary-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
        }

        .task-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.3s ease-out forwards;
            cursor: pointer;
        }

        .task-item:hover {
            background: var(--glass-hover);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-action {
            transition: all 0.2s ease;
        }
        .btn-action:active {
            transform: scale(0.95);
        }

        .recurring-badge {
            font-size: 0.65rem;
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .time-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 0.5rem;
            text-align: center;
            color: white;
            outline: none;
            transition: all 0.2s;
        }
        .time-input:focus {
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.1);
        }

        .alert-ring {
            animation: ring 0.5s ease-in-out 3;
        }

        /* Toast Notification Style */
        .toast-notification {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 2rem;
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 1000;
            animation: slideIn 0.3s ease-out forwards;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        .toast-notification.error {
            border-right: 4px solid #ef4444;
        }
        .toast-notification.success {
            border-right: 4px solid #10b981;
        }
        .toast-notification.warning {
            border-right: 4px solid #f59e0b;
        }
        
        /* Theme Dropdown */
        .theme-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            margin-top: 0.5rem;
            width: 280px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            padding: 1rem;
            z-index: 100;
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
        }
        .theme-dropdown.show {
            display: grid;
            animation: fadeIn 0.2s ease-out;
        }
        .theme-option {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 0.75rem;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .theme-option:hover {
            transform: scale(1.05);
            border-color: white;
        }
        
        /* Stop Timer Button */
        .stop-alarm-btn {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #ef4444;
            padding: 1rem 1.5rem;
            border-radius: 2rem;
            font-weight: bold;
            z-index: 1000;
            animation: pulse 1s infinite;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Header -->
    <header class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6 mb-10">
        <div class="flex items-center gap-6 relative">
            <button onclick="window.history.back()" class="p-3 glass-card rounded-2xl hover:bg-white/10 transition-all group">
                <svg class="w-6 h-6 text-indigo-400 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
            </button>
            
            <!-- Theme Button with Dropdown -->
            <div class="relative">
                <button onclick="toggleThemeDropdown()" class="p-3 glass-card rounded-2xl hover:bg-white/10 transition-all group">
                    <svg class="w-6 h-6 text-indigo-400 group-hover:rotate-45 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path>
                    </svg>
                </button>
                <div id="themeDropdown" class="theme-dropdown"></div>
            </div>
            
            <div>
                <h1 class="text-4xl font-black tracking-tight" style="color: var(--primary-color);">ASTRA CLOCK</h1>
                <p class="text-[10px] opacity-40 tracking-[0.2em] font-bold uppercase mt-1">Timer & Stopwatch</p>
            </div>
        </div>
        
        <div class="glass-card py-3 px-6 rounded-[2rem]">
            <div class="text-center">
                <p class="text-[10px] opacity-40 tracking-widest uppercase">الوقت الحالي</p>
                <p id="currentTime" class="text-xl font-mono font-bold">--:--:--</p>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto space-y-8">
        <!-- Timer & Stopwatch Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Timer Section -->
            <div class="glass-card p-6 rounded-[2rem]">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-black flex items-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        مؤقت
                    </h3>
                    <div class="flex gap-2">
                        <button onclick="setQuickTimer(120)" class="text-xs px-3 py-1 rounded-full bg-white/5 hover:bg-white/10 transition-all">2 د</button>
                        <button onclick="setQuickTimer(300)" class="text-xs px-3 py-1 rounded-full bg-white/5 hover:bg-white/10 transition-all">5 د</button>
                        <button onclick="setQuickTimer(600)" class="text-xs px-3 py-1 rounded-full bg-white/5 hover:bg-white/10 transition-all">10 د</button>
                        <button onclick="setQuickTimer(1800)" class="text-xs px-3 py-1 rounded-full bg-white/5 hover:bg-white/10 transition-all">30 د</button>
                    </div>
                </div>
                
                <div class="text-center mb-6">
                    <div id="timerDisplay" class="timer-display text-6xl md:text-7xl mb-4">00:00:00</div>
                    <div class="flex justify-center gap-3 flex-wrap">
                        <input type="number" id="timerMinutes" placeholder="دقائق" class="time-input w-28" value="0" min="0">
                        <input type="number" id="timerSeconds" placeholder="ثواني" class="time-input w-28" value="0" min="0" max="59">
                        <button onclick="startTimer()" id="timerStartBtn" class="btn-action px-6 py-3 rounded-2xl font-bold bg-indigo-600 hover:bg-indigo-500 transition-all">▶ بدء</button>
                        <button onclick="stopTimer()" class="btn-action px-6 py-3 rounded-2xl font-bold bg-red-600/50 hover:bg-red-600 transition-all">⏸ إيقاف</button>
                        <button onclick="resetTimer()" class="btn-action px-6 py-3 rounded-2xl font-bold bg-white/10 hover:bg-white/20 transition-all">↺ إعادة</button>
                    </div>
                </div>
            </div>

            <!-- Stopwatch Section -->
            <div class="glass-card p-6 rounded-[2rem]">
                <h3 class="text-xl font-black flex items-center gap-2 mb-6">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    كرونومتر
                </h3>
                
                <div class="text-center mb-6">
                    <div id="stopwatchDisplay" class="timer-display text-6xl md:text-7xl mb-4">00:00:00</div>
                    <div class="flex justify-center gap-3">
                        <button onclick="startStopwatch()" class="btn-action px-8 py-3 rounded-2xl font-bold bg-indigo-600 hover:bg-indigo-500 transition-all">▶ بدء</button>
                        <button onclick="stopStopwatch()" class="btn-action px-8 py-3 rounded-2xl font-bold bg-red-600/50 hover:bg-red-600 transition-all">⏸ إيقاف</button>
                        <button onclick="resetStopwatch()" class="btn-action px-8 py-3 rounded-2xl font-bold bg-white/10 hover:bg-white/20 transition-all">↺ إعادة</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tasks Section -->
        <div class="glass-card p-6 rounded-[2rem]">
            <div class="flex justify-between items-center mb-6 flex-wrap gap-4">
                <h3 class="text-xl font-black flex items-center gap-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                    </svg>
                    المهام المرتبطة بالوقت
                </h3>
                <button onclick="openAddTaskModal()" class="btn-action px-6 py-2 rounded-2xl font-bold bg-indigo-600/50 hover:bg-indigo-600 transition-all text-sm">+ إضافة مهمة جديدة</button>
            </div>

            <!-- Quick Tasks -->
            <div class="mb-8">
                <p class="text-sm opacity-60 mb-3">⚡ مهام سريعة:</p>
                <div class="flex flex-wrap gap-3">
                    <button onclick="startTaskWithTime(120, 'تنظيف الأسنان')" class="task-item px-4 py-2 rounded-xl text-sm">🦷 تنظيف الأسنان (2 د)</button>
                    <button onclick="startTaskWithTime(30, 'شرب الماء')" class="task-item px-4 py-2 rounded-xl text-sm">💧 شرب الماء (30 ث)</button>
                    <button onclick="startTaskWithTime(300, 'تمارين خفيفة')" class="task-item px-4 py-2 rounded-xl text-sm">🏃 تمارين خفيفة (5 د)</button>
                    <button onclick="startTaskWithTime(600, 'استراحة قصيرة')" class="task-item px-4 py-2 rounded-xl text-sm">🧘 استراحة قصيرة (10 د)</button>
                    <button onclick="startTaskWithTime(180, 'تأمل')" class="task-item px-4 py-2 rounded-xl text-sm">🧠 تأمل (3 د)</button>
                </div>
            </div>

            <!-- Custom Tasks List -->
            <div>
                <p class="text-sm opacity-60 mb-3">📋 مهامي المخصصة:</p>
                <div id="tasksList" class="space-y-2 max-h-80 overflow-y-auto custom-scrollbar"></div>
                <div id="noTasks" class="text-center py-8 opacity-40 text-sm">
                    لا توجد مهام مخصصة. أضف مهمتك الأولى!
                </div>
            </div>
        </div>
    </main>

    <!-- Add Task Modal -->
    <div id="taskModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden items-center justify-center" onclick="closeTaskModal(event)">
        <div class="glass-card p-8 rounded-[2rem] max-w-md w-full mx-4" onclick="event.stopPropagation()">
            <h3 class="text-2xl font-bold mb-4">➕ إضافة مهمة جديدة</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="text-sm opacity-70 block mb-2">اسم المهمة *</label>
                    <input type="text" id="newTaskName" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 outline-none focus:border-indigo-500 transition-all" placeholder="مثال: قراءة كتاب">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-sm opacity-70 block mb-2">الدقائق *</label>
                        <input type="number" id="newTaskMinutes" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 outline-none focus:border-indigo-500" value="1" min="0">
                    </div>
                    <div>
                        <label class="text-sm opacity-70 block mb-2">الثواني *</label>
                        <input type="number" id="newTaskSeconds" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 outline-none focus:border-indigo-500" value="0" min="0" max="59">
                    </div>
                </div>
                
                <div>
                    <label class="text-sm opacity-70 block mb-2">التكرار (اختياري)</label>
                    <select id="newTaskRecurring" class="w-full bg-white/5 border border-white/10 rounded-xl p-3 outline-none">
                        <option value="none">لا تكرار</option>
                        <option value="daily">يومي</option>
                        <option value="weekly">أسبوعي</option>
                        <option value="monthly">شهري</option>
                    </select>
                </div>
                
                <div class="flex gap-3 pt-4">
                    <button onclick="addCustomTask()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold transition-all">💾 حفظ المهمة</button>
                    <button onclick="closeTaskModal()" class="flex-1 bg-white/10 hover:bg-white/20 py-3 rounded-xl font-bold transition-all">إلغاء</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Stop Alarm Button (appears when timer ends) -->
    <div id="stopAlarmBtn" class="stop-alarm-btn hidden" onclick="stopAlarmSound()">
        ⏹️ إيقاف التنبيه
    </div>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>

    <script>
        // Timer Variables
        let timerInterval = null;
        let timerSecondsLeft = 0;
        let isTimerRunning = false;
        
        // Stopwatch Variables
        let stopwatchInterval = null;
        let stopwatchSeconds = 0;
        let isStopwatchRunning = false;
        
        // Sound Variables
        let alarmAudioContext = null;
        let alarmOscillator = null;
        let alarmGain = null;
        let isAlarmPlaying = false;
        
        // Tasks Storage
        let customTasks = JSON.parse(localStorage.getItem('astra_clock_tasks')) || [];
        
        // ========== Toast Notification Function ==========
        function showToast(message, type = 'warning') {
            const existingToast = document.querySelector('.toast-notification');
            if (existingToast) existingToast.remove();
            
            const toast = document.createElement('div');
            toast.className = `toast-notification ${type}`;
            const icons = {
                error: '❌',
                success: '✅',
                warning: '⚠️'
            };
            toast.innerHTML = `${icons[type] || 'ℹ️'} ${message}`;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
        
        // ========== Theme Functions ==========
        const themes = [
            { bg: 'radial-gradient(circle at top right, #1e1b4b, #000)', accent: '#6366f1', name: 'بنفسجي' },
            { bg: 'radial-gradient(circle at top right, #0f172a, #000)', accent: '#38bdf8', name: 'أزرق' },
            { bg: 'radial-gradient(circle at top right, #064e3b, #000)', accent: '#34d399', name: 'زيتي' },
            { bg: 'radial-gradient(circle at top right, #451a03, #000)', accent: '#fbbf24', name: 'ذهبي' },
            { bg: 'radial-gradient(circle at top right, #4c0519, #000)', accent: '#fb7185', name: 'وردي' },
            { bg: 'radial-gradient(circle at top right, #1e1e1e, #000)', accent: '#ffffff', name: 'أبيض' },
            { bg: 'radial-gradient(circle at top right, #2e1065, #000)', accent: '#a78bfa', name: 'بنفسجي فاتح' },
            { bg: 'radial-gradient(circle at top right, #0c4a6e, #000)', accent: '#7dd3fc', name: 'سماوي' },
            { bg: 'radial-gradient(circle at top right, #3f6212, #000)', accent: '#a3e635', name: 'ليموني' },
            { bg: 'radial-gradient(circle at top right, #7c2d12, #000)', accent: '#fb923c', name: 'برتقالي' },
            { bg: 'radial-gradient(circle at top right, #134e4a, #000)', accent: '#2dd4bf', name: 'فيروزي' },
            { bg: 'radial-gradient(circle at top right, #581c87, #000)', accent: '#d8b4fe', name: 'لافندر' },
            { bg: 'radial-gradient(circle at top right, #831843, #000)', accent: '#f472b6', name: 'زهري' },
            { bg: 'radial-gradient(circle at top right, #0f172a, #334155)', accent: '#94a3b8', name: 'رمادي' },
            { bg: 'radial-gradient(circle at top right, #1e1b4b, #4338ca)', accent: '#818cf8', name: 'نيلي' },
            { bg: 'radial-gradient(circle at top right, #2b2d42, #1e1b4b)', accent: '#8d99ae', name: 'فضي' },
            { bg: 'radial-gradient(circle at top right, #6d28d9, #4c1d95)', accent: '#c084fc', name: 'أرجواني' },
            { bg: 'radial-gradient(circle at top right, #b91c1c, #7f1a1a)', accent: '#f87171', name: 'أحمر' },
            { bg: 'radial-gradient(circle at top right, #0f172a, #1e293b)', accent: '#60a5fa', name: 'أزرق داكن' },
            { bg: 'radial-gradient(circle at top right, #2dd4bf, #0d9488)', accent: '#f0fdfa', name: 'نعناعي' }
        ];
        
        function initThemeDropdown() {
            const grid = document.getElementById('themeDropdown');
            grid.innerHTML = '';
            themes.forEach(theme => {
                const dot = document.createElement('div');
                dot.className = 'theme-option';
                dot.style.background = theme.bg;
                dot.title = theme.name;
                dot.onclick = (e) => {
                    e.stopPropagation();
                    applyTheme(theme);
                    showToast(`تم تطبيق ثيم ${theme.name}`, 'success');
                    document.getElementById('themeDropdown').classList.remove('show');
                };
                grid.appendChild(dot);
            });
        }
        
        function toggleThemeDropdown() {
            const dropdown = document.getElementById('themeDropdown');
            dropdown.classList.toggle('show');
        }
        
        function applyTheme(theme) {
            document.body.style.background = theme.bg;
            document.documentElement.style.setProperty('--primary-color', theme.accent);
            localStorage.setItem('astra_clock_theme', JSON.stringify(theme));
            const titleElement = document.querySelector('h1');
            if (titleElement) titleElement.style.color = theme.accent;
        }
        
        function loadSavedTheme() {
            const savedTheme = localStorage.getItem('astra_clock_theme');
            if (savedTheme) {
                const theme = JSON.parse(savedTheme);
                applyTheme(theme);
            }
        }
        
        // ========== Alarm Sound (Nature-like, continuous) ==========
        function startAlarmSound() {
            if (isAlarmPlaying) return;
            
            try {
                alarmAudioContext = new (window.AudioContext || window.webkitAudioContext)();
                alarmGain = alarmAudioContext.createGain();
                alarmGain.connect(alarmAudioContext.destination);
                alarmGain.gain.value = 0.3;
                
                function playBeep() {
                    if (!isAlarmPlaying) return;
                    
                    const osc = alarmAudioContext.createOscillator();
                    osc.connect(alarmGain);
                    osc.type = 'sine';
                    osc.frequency.value = 523.25;
                    osc.start();
                    osc.stop(alarmAudioContext.currentTime + 0.3);
                    
                    setTimeout(() => {
                        if (isAlarmPlaying) {
                            const osc2 = alarmAudioContext.createOscillator();
                            osc2.connect(alarmGain);
                            osc2.type = 'sine';
                            osc2.frequency.value = 659.25;
                            osc2.start();
                            osc2.stop(alarmAudioContext.currentTime + 0.3);
                        }
                    }, 300);
                    
                    setTimeout(() => {
                        if (isAlarmPlaying) playBeep();
                    }, 800);
                }
                
                isAlarmPlaying = true;
                playBeep();
                document.getElementById('stopAlarmBtn').classList.remove('hidden');
                showToast('⏰ انتهى المؤقت! اضغط على زر الإيقاف', 'warning');
            } catch(e) {
                console.log('Audio not supported');
            }
        }
        
        function stopAlarmSound() {
            isAlarmPlaying = false;
            if (alarmAudioContext) {
                alarmAudioContext.close();
                alarmAudioContext = null;
            }
            document.getElementById('stopAlarmBtn').classList.add('hidden');
            showToast('تم إيقاف التنبيه', 'success');
        }
        
        // Update current time
        function updateCurrentTime() {
            const now = new Date();
            document.getElementById('currentTime').innerText = now.toLocaleTimeString('ar-EG');
        }
        setInterval(updateCurrentTime, 1000);
        updateCurrentTime();
        
        // Timer Functions
        function updateTimerDisplay() {
            const hours = Math.floor(timerSecondsLeft / 3600);
            const minutes = Math.floor((timerSecondsLeft % 3600) / 60);
            const seconds = timerSecondsLeft % 60;
            document.getElementById('timerDisplay').innerHTML = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
        
        function setTimerFromInput() {
            const minutes = parseInt(document.getElementById('timerMinutes').value) || 0;
            const seconds = parseInt(document.getElementById('timerSeconds').value) || 0;
            timerSecondsLeft = (minutes * 60) + seconds;
            updateTimerDisplay();
        }
        
        function startTimer() {
            if (isTimerRunning) return;
            
            const minutes = parseInt(document.getElementById('timerMinutes').value) || 0;
            const seconds = parseInt(document.getElementById('timerSeconds').value) || 0;
            
            if (timerSecondsLeft === 0 && (minutes > 0 || seconds > 0)) {
                timerSecondsLeft = (minutes * 60) + seconds;
                updateTimerDisplay();
            }
            
            if (timerSecondsLeft <= 0) {
                showToast('الرجاء إدخال وقت صحيح', 'error');
                return;
            }
            
            isTimerRunning = true;
            timerInterval = setInterval(() => {
                if (timerSecondsLeft > 0) {
                    timerSecondsLeft--;
                    updateTimerDisplay();
                }
                
                if (timerSecondsLeft === 0) {
                    stopTimer();
                    startAlarmSound();
                    showNotification('⏰ انتهى المؤقت!', 'الوقت المحدد قد انتهى');
                    document.getElementById('timerDisplay').classList.add('alert-ring');
                    setTimeout(() => {
                        document.getElementById('timerDisplay').classList.remove('alert-ring');
                    }, 1500);
                }
            }, 1000);
        }
        
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            isTimerRunning = false;
        }
        
        function resetTimer() {
            stopTimer();
            setTimerFromInput();
        }
        
        function setQuickTimer(seconds) {
            stopTimer();
            timerSecondsLeft = seconds;
            updateTimerDisplay();
            document.getElementById('timerMinutes').value = Math.floor(seconds / 60);
            document.getElementById('timerSeconds').value = seconds % 60;
        }
        
        // Stopwatch Functions
        function updateStopwatchDisplay() {

            const minutes = Math.floor((stopwatchSeconds % 3600) / 60);
            const seconds = stopwatchSeconds % 60;
            document.getElementById('stopwatchDisplay').innerHTML = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
        
        function startStopwatch() {
            if (isStopwatchRunning) return;
            isStopwatchRunning = true;
            stopwatchInterval = setInterval(() => {
                stopwatchSeconds++;
                updateStopwatchDisplay();
            }, 1000);
        }
        
        function stopStopwatch() {
            if (stopwatchInterval) {
                clearInterval(stopwatchInterval);
                stopwatchInterval = null;
            }
            isStopwatchRunning = false;
        }
        
        function resetStopwatch() {
            stopStopwatch();

            updateStopwatchDisplay();

        // Notification
        function showNotification(title, body) {
            if (Notification.permission === 'granted') {
                new Notification(title, { body: body });
            } else if (Notification.permission !== 'denied') {
                Notification.requestPermission();
            }
        }
