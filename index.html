<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra - Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --accent: #6366f1; 
            --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
        }
        body { 
            background: var(--bg-gradient); 
            background-attachment: fixed; 
            min-height: 100vh; 
            transition: background 0.5s ease;
            font-family: 'Tajawal', sans-serif;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .filter-btn {
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
        }
        .filter-btn.active { 
            border-bottom: 2px solid var(--accent); 
            opacity: 1; 
            color: var(--accent); 
        }
        
        #settingsMenu { 
            display: none; 
            z-index: 100; 
            position: absolute;
            left: 2rem;
            top: 5.5rem;
            width: 320px;
        }
        #settingsMenu.show { display: block; animation: slideDown 0.2s ease-out; }
        
        @keyframes slideDown { 
            from { opacity: 0; transform: translateY(-10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        .theme-dot { 
            width: 100%; 
            aspect-ratio: 1; 
            border-radius: 12px; 
            cursor: pointer; 
            border: 2px solid rgba(255,255,255,0.1); 
            transition: 0.3s; 
        }
        .theme-dot:hover { transform: scale(1.1); border-color: white; }
        
        #confirmModal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.8); 
            backdrop-filter: blur(8px); 
            z-index: 200; 
            align-items: center; 
            justify-content: center; 
        }
        #confirmModal.show { display: flex; }
        .confetti { position: absolute; pointer-events: none; z-index: 50; border-radius: 50%; }

        .app-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        input[type="checkbox"] {
            appearance: none;
            width: 28px;
            height: 28px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            transition: 0.3s;
        }
        input[type="checkbox"]:checked {
            background-color: var(--accent);
            border-color: var(--accent);
        }
        input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
        }
    </style>

    <script>
        // تطبيق الثيم المحفوظ فوراً لتجنب الوميض الأبيض
        (function() {
            const savedTheme = JSON.parse(localStorage.getItem('astra_theme_data'));
            if (savedTheme) {
                document.documentElement.style.setProperty('--accent', savedTheme.accent);
                document.documentElement.style.setProperty('--bg-gradient', savedTheme.bg);
            }
        })();
    </script>
</head>
<body class="text-white">

    <div class="app-container min-h-screen flex flex-col">
        <!-- Header -->
        <header class="flex justify-between items-start mb-10 shrink-0 relative">
            <div class="flex items-center gap-4">
                <div class="glass-card p-4 rounded-3xl text-center min-w-[100px]">
                    <span class="text-4xl font-bold block" id="completion-rate">0%</span>
                    <p class="text-[10px] uppercase opacity-50 tracking-widest mt-1" id="rate-label">نسبة الإنجاز</p>
                </div>

                <a href="#" class="p-4 glass-card rounded-3xl hover:bg-white/10 transition-all text-white/40 hover:text-white group" title="مصفوفة أيزنهاور">
                    <svg class="w-6 h-6 group-hover:rotate-90 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                    </svg>
                </a>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <h1 class="text-4xl font-bold tracking-tighter" id="brand-name" style="color: var(--accent);">ASTRA</h1>
                    <p class="text-xs opacity-50" id="slogan">نظّم مهامك بذكاء</p>
                </div>
                <button id="menuTrigger" onclick="toggleMenu(event)" class="p-4 glass-card rounded-3xl hover:bg-white/10 transition-colors relative z-[110]">
                    <span class="text-xl">⚙️</span>
                </button>
            </div>

            <!-- Settings Menu inside Header for better positioning -->
            <div id="settingsMenu" onclick="event.stopPropagation();" class="glass-card rounded-[2.5rem] p-6 shadow-2xl border-white/20">
                <h3 class="text-[10px] font-bold opacity-50 mb-4 uppercase tracking-wider" id="theme-label">اختر السمة (15 ثيم)</h3>
                <div class="grid grid-cols-5 gap-2 mb-6" id="themeGrid"></div>
                
                <div class="flex items-center justify-between bg-white/5 p-3 rounded-2xl mb-4">
                    <span class="text-xs font-medium" id="lang-label">لغة التطبيق</span>
                    <select onchange="changeLanguage(this.value)" class="bg-white/10 text-white text-xs border-none rounded-lg p-1 outline-none">
                        <option value="ar">العربية</option>
                        <option value="en">English</option>
                        <option value="fr">Français</option>
                    </select>
                </div>
                
                <button onclick="openModal()" class="w-full text-center py-3 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded-2xl text-[11px] font-bold transition-colors" id="clear-btn-text">مسح جميع المهام</button>
            </div>
        </header>

        <!-- Input Section -->
        <div class="flex gap-3 p-2 glass-card rounded-[2rem] mb-8 items-center shadow-lg shrink-0">
            <input type="text" id="taskInput" class="bg-transparent flex-grow p-4 outline-none text-lg text-white placeholder-white/30" placeholder="أضف مهمة جديدة..." autocomplete="off">
            <button onclick="addTask()" id="addBtn" style="background-color: var(--accent);" class="hover:opacity-90 px-8 py-4 rounded-[1.5rem] font-bold text-md transition-all active:scale-95 shadow-lg shadow-black/20">إضافة</button>
        </div>

        <!-- Filter Tabs -->
        <div class="flex gap-8 mb-6 text-[11px] font-bold uppercase tracking-widest opacity-60 shrink-0 px-2">
            <button onclick="setFilter('all')" class="filter-btn active pb-2" id="f-all">الكل</button>
            <button onclick="setFilter('active')" class="filter-btn pb-2" id="f-active">قيد التنفيذ</button>
            <button onclick="setFilter('completed')" class="filter-btn pb-2" id="f-completed">المكتملة</button>
        </div>

        <!-- Task List Container -->
        <div class="flex-grow pb-10">
            <div id="taskList" class="grid grid-cols-1 gap-3"></div>
            <div id="emptyState" class="text-center py-20 opacity-20 hidden">
                <p class="text-6xl mb-4">✨</p>
                <p id="empty-text" class="text-xl font-medium">لا توجد مهام حالياً</p>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirmModal" onclick="closeModal()">
        <div class="glass-card p-8 rounded-[2.5rem] max-w-xs w-full text-center border-white/20 mx-4" onclick="event.stopPropagation();">
            <h2 class="text-2xl font-bold mb-2" id="confirm-title">حذف الكل؟</h2>
            <p class="text-xs opacity-60 mb-8" id="confirm-body">هل أنت متأكد؟ لا يمكن استرجاع المهام بعد حذفها.</p>
            <div class="flex gap-3">
                <button onclick="clearAll()" id="confirm-btn-action" class="flex-1 bg-red-600 hover:bg-red-500 py-3 rounded-2xl font-bold text-sm">نعم، احذف</button>
                <button onclick="closeModal()" id="confirm-cancel-btn" class="flex-1 bg-white/10 hover:bg-white/20 py-3 rounded-2xl font-bold text-sm">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('astra_tasks')) || [];
        let currentFilter = 'all';
        let currentLang = 'ar';

        const i18n = {
            ar: { rate: "نسبة الإنجاز", slogan: "نظّم مهامك بذكاء", placeholder: "أضف مهمة جديدة...", add: "إضافة", themes: "اختر السمة (15 ثيم)", lang: "لغة التطبيق", clear: "مسح جميع المهام", empty: "لا توجد مهام حالياً", all: "الكل", active: "قيد التنفيذ", completed: "المكتملة", cTitle: "حذف الكل؟", cBody: "لا يمكن التراجع عن الحذف.", cBtn: "نعم، احذف", cCan: "إلغاء" },
            en: { rate: "Progress", slogan: "Organize smartly", placeholder: "Add new task...", add: "Add", themes: "Themes (15)", lang: "Language", clear: "Clear All Tasks", empty: "No tasks yet", all: "All", active: "Active", completed: "Completed", cTitle: "Clear All?", cBody: "This cannot be undone.", cBtn: "Yes, Clear", cCan: "Cancel" },
            fr: { rate: "Progrès", slogan: "Organisez intelligemment", placeholder: "Ajouter une tâche...", add: "Ajouter", themes: "Thèmes (15)", lang: "Langue", clear: "Tout effacer", empty: "Aucune tâche", all: "Tout", active: "En cours", completed: "Terminé", cTitle: "Tout effacer?", cBody: "Action irréversible.", cBtn: "Oui, effacer", cCan: "Annuler" }
        };

        const themes = [
            { bg: 'linear-gradient(135deg, #1e1b4b, #312e81)', accent: '#6366f1' },
            { bg: 'linear-gradient(135deg, #0f172a, #1e293b)', accent: '#38bdf8' },
            { bg: 'linear-gradient(135deg, #064e3b, #065f46)', accent: '#34d399' },
            { bg: 'linear-gradient(135deg, #451a03, #78350f)', accent: '#fbbf24' },
            { bg: 'linear-gradient(135deg, #4c0519, #831843)', accent: '#fb7185' },
            { bg: 'linear-gradient(135deg, #1e1e1e, #111111)', accent: '#ffffff' },
            { bg: 'linear-gradient(135deg, #2e1065, #4338ca)', accent: '#a78bfa' },
            { bg: 'linear-gradient(135deg, #0c4a6e, #075985)', accent: '#7dd3fc' },
            { bg: 'linear-gradient(135deg, #3f6212, #4d7c0f)', accent: '#a3e635' },
            { bg: 'linear-gradient(135deg, #7c2d12, #9a3412)', accent: '#fb923c' },
            { bg: 'linear-gradient(135deg, #134e4a, #115e59)', accent: '#2dd4bf' },
            { bg: 'linear-gradient(135deg, #581c87, #6b21a8)', accent: '#d8b4fe' },
            { bg: 'linear-gradient(135deg, #831843, #9d174d)', accent: '#f472b6' },
            { bg: 'linear-gradient(135deg, #0f172a, #334155)', accent: '#94a3b8' },
            { bg: 'linear-gradient(135deg, #1e1b4b, #4338ca)', accent: '#818cf8' }
        ];

        // إغلاق القائمة عند النقر خارجها
        document.addEventListener('click', () => {
            const menu = document.getElementById('settingsMenu');
            if (menu.classList.contains('show')) menu.classList.remove('show');
        });

        function toggleMenu(e) {
            e.stopPropagation();
            document.getElementById('settingsMenu').classList.toggle('show');
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            
            let filtered = tasks;
            if (currentFilter === 'active') filtered = tasks.filter(t => !t.completed);
            if (currentFilter === 'completed') filtered = tasks.filter(t => t.completed);

            if (filtered.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
            } else {
                document.getElementById('emptyState').classList.add('hidden');
            }

            filtered.forEach((task, index) => {
                const actualIndex = tasks.indexOf(task);
                const div = document.createElement('div');
                div.className = `glass-card p-4 rounded-3xl flex items-center gap-4 transition-all hover:bg-white/5 ${task.completed ? 'opacity-50' : ''}`;
                div.innerHTML = `
                    <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${actualIndex})">
                    <span class="flex-grow text-lg ${task.completed ? 'line-through opacity-50' : ''}">${task.text}</span>
                    <button onclick="deleteTask(${actualIndex})" class="text-white/20 hover:text-red-400 transition-colors p-2">✕</button>
                `;
                list.appendChild(div);
            });
            updateStats();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const val = input.value.trim();
            if (val) {
                tasks.unshift({ text: val, completed: false });
                saveAndRender();
                input.value = '';
            }
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            if(tasks[index].completed) {
                playBell();
                createConfetti();
            }
            saveAndRender();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            saveAndRender();
        }

        function clearAll() {
            tasks = [];
            closeModal();
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('astra_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function setFilter(f) {
            currentFilter = f;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('f-' + f).classList.add('active');
            renderTasks();
        }

        function changeLanguage(lang) {
            currentLang = lang;
            const t = i18n[lang];
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            
            document.getElementById('rate-label').innerText = t.rate;
            document.getElementById('slogan').innerText = t.slogan;
            document.getElementById('taskInput').placeholder = t.placeholder;
            document.getElementById('addBtn').innerText = t.add;
            document.getElementById('theme-label').innerText = t.themes;
            document.getElementById('lang-label').innerText = t.lang;
            document.getElementById('clear-btn-text').innerText = t.clear;
            document.getElementById('empty-text').innerText = t.empty;
            document.getElementById('f-all').innerText = t.all;
            document.getElementById('f-active').innerText = t.active;
            document.getElementById('f-completed').innerText = t.completed;
            document.getElementById('confirm-title').innerText = t.cTitle;
            document.getElementById('confirm-body').innerText = t.cBody;
            document.getElementById('confirm-btn-action').innerText = t.cBtn;
            document.getElementById('confirm-cancel-btn').innerText = t.cCan;
            
            renderTasks();
        }

        function applyTheme(t) {
            document.body.style.background = t.bg;
            document.documentElement.style.setProperty('--accent', t.accent);
            document.documentElement.style.setProperty('--bg-gradient', t.bg);
            document.getElementById('brand-name').style.color = t.accent;
            document.getElementById('addBtn').style.backgroundColor = t.accent;
            localStorage.setItem('astra_theme_data', JSON.stringify(t));
        }

        function initThemes() {
            const grid = document.getElementById('themeGrid');
            themes.forEach(t => {
                const dot = document.createElement('div');
                dot.className = 'theme-dot';
                dot.style.background = t.bg;
                dot.onclick = (e) => {
                    e.stopPropagation();
                    applyTheme(t);
                };
                grid.appendChild(dot);
            });

            const saved = JSON.parse(localStorage.getItem('astra_theme_data'));
            if (saved) applyTheme(saved);
        }

        function updateStats() {
            const done = tasks.filter(t => t.completed).length;
            const perc = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
            document.getElementById('completion-rate').innerText = perc + '%';
        }

        function openModal() { document.getElementById('confirmModal').classList.add('show'); }
        function closeModal() { document.getElementById('confirmModal').classList.remove('show'); }

        function playBell() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.value = 800; gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } catch(e) {}
        }

        function createConfetti() {
            for (let i = 0; i < 20; i++) {
                const c = document.createElement('div');
                c.className = 'confetti';
                c.style.left = '50%';
                c.style.top = '50%';
                c.style.width = '8px';
                c.style.height = '8px';
                c.style.backgroundColor = `hsl(${Math.random() * 360}, 80%, 60%)`;
                document.body.appendChild(c);
                const x = (Math.random() - 0.5) * 600;
                const y = (Math.random() - 0.5) * 600;
                c.animate([
                    { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                    { transform: `translate(${x}px, ${y}px) scale(0)`, opacity: 0 }
                ], { duration: 1000, easing: 'ease-out' }).onfinish = () => c.remove();
            }
        }

        // Initialize
        window.onload = () => {
            initThemes();
            renderTasks();
            document.getElementById('taskInput').addEventListener('keypress', (e) => { 
                if (e.key === 'Enter') addTask(); 
            });
        };
    </script>
</body>
</html>
