<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Astra Matrix Pro - نظام إدارة الأولويات</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #6366f1; 
            --bg-gradient: radial-gradient(circle at top right, #1e1b4b, #000);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.08);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 5px var(--primary-color); }
            50% { box-shadow: 0 0 20px var(--primary-color); }
            100% { box-shadow: 0 0 5px var(--primary-color); }
        }

        @keyframes taskIn {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        body { 
            background: var(--bg-gradient); 
            background-attachment: fixed; 
            min-height: 100vh; 
            font-family: 'Tajawal', 'Inter', sans-serif;
            color: white;
            margin: 0;
            overflow-x: hidden;
            transition: background 0.8s ease;
        }
        
        .glass-card { 
            background: var(--glass); 
            backdrop-filter: blur(20px) saturate(160%); 
            border: 1px solid var(--border); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s ease-out forwards;
        }

        .task-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: taskIn 0.3s ease-out forwards;
        }

        .task-item:hover {
            background: var(--glass-hover);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .stat-circle {
            width: 70px;
            height: 70px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid var(--primary-color);
            transition: all 0.5s ease;
            animation: pulseGlow 4s infinite ease-in-out;
        }

        /* Quadrant Specific Colors */
        .box-do { border-top: 4px solid #ef4444 !important; }
        .box-schedule { border-top: 4px solid #3b82f6 !important; }
        .box-delegate { border-top: 4px solid #f59e0b !important; }
        .box-delete { border-top: 4px solid #6b7280 !important; }

        .title-do { color: #f87171; }
        .title-schedule { color: #60a5fa; }
        .title-delegate { color: #fb923c; }
        .title-delete { color: #9ca3af; }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary-color);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .btn-action {
            transition: all 0.2s ease;
        }
        .btn-action:active { transform: scale(0.92); }
    </style>
</head>
<body class="p-4 md:p-10">

    <header class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6 mb-12">
        <div class="flex items-center gap-6">
            <button onclick="window.history.back()" class="p-3 glass-card rounded-2xl hover:bg-white/10 transition-all group">
                <svg class="w-6 h-6 text-indigo-400 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
            </button>
            <div>
                <h1 class="text-4xl font-black tracking-tight" style="color: var(--primary-color); text-shadow: 0 0 20px rgba(99, 102, 241, 0.3);">ASTRA MATRIX</h1>
                <p class="text-[10px] opacity-40 tracking-[0.2em] font-bold uppercase mt-1">Professional Task Architecture</p>
            </div>
        </div>
        
        <div class="flex items-center gap-6">
            <div class="flex flex-col items-end">
                <div class="flex gap-2 mb-2">
                    <button onclick="setFilter('all')" id="filter-all" class="text-[10px] px-3 py-1 rounded-full border border-white/10 bg-white/5 hover:bg-white/10 transition-all opacity-100">الكل</button>
                    <button onclick="setFilter('active')" id="filter-active" class="text-[10px] px-3 py-1 rounded-full border border-white/10 bg-white/5 hover:bg-white/10 transition-all opacity-50">قيد التنفيذ</button>
                </div>
                <div class="flex items-center gap-4 glass-card py-3 px-6 rounded-[2rem]">
                    <div class="stat-circle" id="stat-glow">
                        <span id="comp-rate" class="text-2xl font-black italic">0%</span>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] opacity-40 tracking-widest uppercase font-bold">الإنجاز الكلي</p>
                        <p id="task-count" class="text-xs font-medium">0 مهام</p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto space-y-8">
        
        <!-- أدوات التحكم والبحث -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
            <div class="lg:col-span-8 glass-card p-2 rounded-3xl flex flex-col md:flex-row gap-2">
                <input type="text" id="taskInput" class="bg-transparent flex-grow p-4 outline-none text-white placeholder:text-white/20 text-lg" placeholder="ما هي المهمة التالية؟">
                <div class="flex gap-2 p-1">
                    <select id="quadSelect" class="bg-white/5 border border-white/10 px-4 rounded-2xl text-sm outline-none cursor-pointer text-white backdrop-blur-md hover:bg-white/10 transition-all">
                        <option value="do">🔴 عاجل وهام</option>
                        <option value="schedule">🔵 خطط لها</option>
                        <option value="delegate">🟠 فوّضها</option>
                        <option value="delete">⚪ احذفها</option>
                    </select>
                    <button onclick="addTask()" class="btn-action px-10 py-4 rounded-2xl font-black text-white shadow-lg bg-indigo-600 hover:bg-indigo-500" id="add-btn">إضافة</button>
                </div>
            </div>
            
            <div class="lg:col-span-4 glass-card p-2 rounded-3xl flex items-center px-4">
                <svg class="w-5 h-5 opacity-30 ml-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-width="2" stroke-linecap="round"/></svg>
                <input type="text" id="searchInput" oninput="renderTasks()" class="bg-transparent w-full p-3 outline-none text-sm" placeholder="بحث في المصفوفة...">
            </div>
        </div>

        <!-- شبكة المصفوفة -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- الربع الأول -->
            <div class="glass-card p-6 rounded-[2.5rem] box-do group">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="title-do font-black flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                        افعل الآن
                    </h3>
                    <span class="text-[10px] font-bold py-1 px-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400">P1: عاجل / هام</span>
                </div>
                <div id="list-do" class="space-y-3 min-h-[160px] max-h-[400px] overflow-y-auto custom-scrollbar pr-2"></div>
            </div>

            <!-- الربع الثاني -->
            <div class="glass-card p-6 rounded-[2.5rem] box-schedule">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="title-schedule font-black flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                        خطط لها
                    </h3>
                    <span class="text-[10px] font-bold py-1 px-3 rounded-lg bg-blue-500/10 border border-blue-500/20 text-blue-400">P2: غير عاجل / هام</span>
                </div>
                <div id="list-schedule" class="space-y-3 min-h-[160px] max-h-[400px] overflow-y-auto custom-scrollbar pr-2"></div>
            </div>

            <!-- الربع الثالث -->
            <div class="glass-card p-6 rounded-[2.5rem] box-delegate">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="title-delegate font-black flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-orange-500"></span>
                        فوّضها
                    </h3>
                    <span class="text-[10px] font-bold py-1 px-3 rounded-lg bg-orange-500/10 border border-orange-500/20 text-orange-400">P3: عاجل / غير هام</span>
                </div>
                <div id="list-delegate" class="space-y-3 min-h-[160px] max-h-[400px] overflow-y-auto custom-scrollbar pr-2"></div>
            </div>

            <!-- الربع الرابع -->
            <div class="glass-card p-6 rounded-[2.5rem] box-delete">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="title-delete font-black flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-gray-500"></span>
                        احذفها
                    </h3>
                    <span class="text-[10px] font-bold py-1 px-3 rounded-lg bg-gray-500/10 border border-gray-500/20 text-gray-400">P4: غير عاجل / غير هام</span>
                </div>
                <div id="list-delete" class="space-y-3 min-h-[160px] max-h-[400px] overflow-y-auto custom-scrollbar pr-2"></div>
            </div>
        </div>
    </main>

    <script>
        const MATRIX_KEY = 'astra_matrix_tasks_pro';
        let tasks = JSON.parse(localStorage.getItem(MATRIX_KEY)) || [];
        let currentFilter = 'all';

        function applyTheme() {
            const themeData = localStorage.getItem('astra_theme_data');
            if (themeData) {
                const theme = JSON.parse(themeData);
                document.documentElement.style.setProperty('--primary-color', theme.accent);
                if (theme.background) document.body.style.background = theme.background;
            }
            updateStats();
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.getElementById('filter-all').style.opacity = filter === 'all' ? '1' : '0.5';
            document.getElementById('filter-active').style.opacity = filter === 'active' ? '1' : '0.5';
            renderTasks();
        }

        function renderTasks() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const quads = ['do', 'schedule', 'delegate', 'delete'];
            
            quads.forEach(id => {
                const el = document.getElementById('list-' + id);
                if(el) el.innerHTML = '';
            });

            const filteredTasks = tasks.filter(t => {
                const matchesSearch = t.text.toLowerCase().includes(searchQuery);
                const matchesFilter = currentFilter === 'all' || !t.completed;
                return matchesSearch && matchesFilter;
            });

            filteredTasks.forEach((t) => {
                const quad = t.quadrant || 'do'; 
                const list = document.getElementById('list-' + quad);
                
                if (list) {
                    const index = tasks.findIndex(task => task.id === t.id);
                    const item = document.createElement('div');
                    item.className = `task-item p-4 rounded-2xl flex items-center justify-between ${t.completed ? 'opacity-30' : ''}`;
                    
                    const dateStr = new Date(t.id).toLocaleDateString('ar-EG', { month: 'short', day: 'numeric' });

                    item.innerHTML = `
                        <div class="flex items-center gap-4 flex-1">
                            <div class="relative flex items-center justify-center h-6 w-6">
                                <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${index})" 
                                    class="w-6 h-6 rounded-lg cursor-pointer appearance-none border-2 border-white/10 checked:bg-indigo-500 checked:border-transparent transition-all">
                                ${t.completed ? '<svg class="absolute w-4 h-4 text-white pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>' : ''}
                            </div>
                            <div class="flex flex-col">
                                <span class="text-sm font-bold ${t.completed ? 'line-through' : ''}">${t.text}</span>
                                <span class="text-[9px] opacity-30 font-medium tracking-wider mt-0.5">${dateStr}</span>
                            </div>
                        </div>
                        <button onclick="deleteWithAnimation(this, ${index})" class="text-white/10 hover:text-red-400 transition-all p-2 hover:bg-red-500/10 rounded-xl">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    `;
                    list.appendChild(item);
                }
            });

            if (filteredTasks.length === 0 && searchQuery !== "") {
                quads.forEach(id => {
                    const el = document.getElementById('list-' + id);
                    if(el.innerHTML === '') el.innerHTML = '<p class="text-[10px] opacity-20 text-center py-4">لا توجد نتائج</p>';
                });
            }

            updateStats();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const quad = document.getElementById('quadSelect').value;
            if (input.value.trim()) {
                tasks.unshift({ 
                    text: input.value.trim(), 
                    quadrant: quad, 
                    completed: false,
                    id: Date.now()
                });
                input.value = '';
                save();
            }
        }

        function toggleTask(i) { 
            tasks[i].completed = !tasks[i].completed; 
            save(); 
        }

        function deleteWithAnimation(btn, i) {
            const item = btn.closest('.task-item');
            if(item) {
                item.style.transform = 'translateX(50px) scale(0.9)';
                item.style.opacity = '0';
                setTimeout(() => {
                    tasks.splice(i, 1);
                    save();
                }, 300);
            }
        }

        function save() { 
            localStorage.setItem(MATRIX_KEY, JSON.stringify(tasks)); 
            renderTasks(); 
        }

        function updateStats() {
            const done = tasks.filter(t => t.completed).length;
            const total = tasks.length;
            const rate = total ? Math.round((done / total) * 100) : 0;
            
            const rateEl = document.getElementById('comp-rate');
            const countEl = document.getElementById('task-count');
            if(countEl) countEl.innerText = `${total} مهام | ${done} مكتملة`;

            if(!rateEl) return;
            
            let current = parseInt(rateEl.innerText) || 0;
            const step = rate > current ? 1 : -1;
            
            if(current !== rate) {
                const interval = setInterval(() => {
                    if (current === rate) {
                        clearInterval(interval);
                    } else {
                        current += step;
                        rateEl.innerText = current + '%';
                    }
                }, 15);
            } else {
                rateEl.innerText = rate + '%';
            }
            
            const glow = document.getElementById('stat-glow');
            const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--primary-color').trim() || '#6366f1';
            if(glow) {
                glow.style.boxShadow = `0 0 ${10 + (rate/5)}px ${primaryColor}55`;
                glow.style.borderColor = rate === 100 ? '#4ade80' : primaryColor;
            }
        }

        window.onload = () => {
            applyTheme();
            renderTasks();
        };

        document.getElementById('taskInput').addEventListener('keypress', (e) => { 
            if (e.key === 'Enter') addTask(); 
        });

        window.addEventListener('storage', (e) => {
            if (e.key === 'astra_theme_data') applyTheme();
            if (e.key === MATRIX_KEY) {
                tasks = JSON.parse(e.newValue) || [];
                renderTasks();
            }
        });
    </script>
</body>
</html>
