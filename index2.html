<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Astra Matrix - إدارة المهام الاحترافية</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #6366f1; 
            --bg-gradient: radial-gradient(circle at top right, #1e1b4b, #000);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 5px var(--primary-color); }
            50% { box-shadow: 0 0 20px var(--primary-color); }
            100% { box-shadow: 0 0 5px var(--primary-color); }
        }

        @keyframes taskIn {
            0% { opacity: 0; transform: scale(0.8); }
            70% { transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }

        body { 
            background: var(--bg-gradient); 
            background-attachment: fixed; 
            min-height: 100vh; 
            font-family: 'Tajawal', 'Inter', sans-serif;
            color: white;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            transition: background 0.8s ease;
        }
        
        .glass-card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(25px) saturate(180%); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.8s ease-out forwards;
        }

        .task-item {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: taskIn 0.4s ease-out forwards;
        }

        .task-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(-5px) scale(1.01);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .svg-primary { stroke: var(--primary-color) !important; }
        
        #add-btn {
            background-color: var(--primary-color) !important;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        #add-btn:active { transform: scale(0.95); }

        .stat-circle {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--primary-color);
            transition: all 0.5s ease;
            animation: pulseGlow 3s infinite ease-in-out;
        }

        .box-do { border-top: 3px solid #f87171 !important; }
        .box-schedule { border-top: 3px solid #60a5fa !important; }
        .box-delegate { border-top: 3px solid #fb923c !important; }
        .box-delete { border-top: 3px solid #9ca3af !important; }

        .title-do { color: #f87171; }
        .title-schedule { color: #60a5fa; }
        .title-delegate { color: #fb923c; }
        .title-delete { color: #9ca3af; }

        .status-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.05);
            font-weight: bold;
        }

        select option { background: #111; color: white; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-color); }
    </style>
</head>
<body class="p-4 md:p-8">

    <header class="max-w-5xl mx-auto flex justify-between items-center mb-12" style="animation: fadeIn 0.6s ease-out;">
        <div class="flex items-center gap-6">
            <button onclick="window.history.back()" class="p-3 glass-card rounded-2xl hover:bg-white/10 transition-all group">
                <svg class="w-6 h-6 svg-primary group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
            </button>
            <h1 class="text-3xl font-black tracking-tighter" style="color: var(--primary-color); animation: slideInRight 0.8s ease-out;">ASTRA MATRIX</h1>
        </div>
        
        <div class="flex items-center gap-4 glass-card py-2 px-6 rounded-3xl">
            <div class="stat-circle" id="stat-glow">
                <span id="comp-rate" class="text-xl font-bold">0%</span>
            </div>
            <div class="text-right hidden sm:block">
                <p class="text-[10px] opacity-40 tracking-widest uppercase font-bold" data-i18n="rate_label">مستوى الإنجاز</p>
                <p class="text-xs" data-i18n="session_label">تحليل المصفوفة</p>
            </div>
        </div>
    </header>

    <main id="view-matrix" class="max-w-5xl mx-auto pb-24">
        <!-- إضافة المهمة -->
        <div class="glass-card p-2 rounded-[2rem] mb-10 flex flex-col md:flex-row gap-2">
            <input type="text" id="taskInput" class="bg-transparent flex-grow p-4 outline-none text-white placeholder:text-white/20 text-lg" data-i18n-placeholder="input_placeholder" placeholder="أضف مهمة جديدة...">
            <div class="flex gap-2 p-1">
                <select id="quadSelect" class="bg-white/5 border-none px-4 rounded-2xl text-sm outline-none cursor-pointer text-white backdrop-blur-lg hover:bg-white/10 transition-colors">
                    <option value="do" data-i18n="opt_do">🔴 عاجل وهام</option>
                    <option value="schedule" data-i18n="opt_schedule">🔵 خطط لها</option>
                    <option value="delegate" data-i18n="opt_delegate">🟠 فوّضها</option>
                    <option value="delete" data-i18n="opt_delete">⚪ احذفها</option>
                </select>
                <button onclick="addTask()" class="px-10 py-4 rounded-2xl font-bold text-white shadow-lg active:scale-95 transition-all" id="add-btn" data-i18n="add_btn">إضافة</button>
            </div>
        </div>

        <!-- شبكة المصفوفة -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="glass-card p-6 rounded-[2.5rem] box-do relative overflow-hidden">
                <h3 class="title-do font-bold mb-6 flex justify-between items-center">
                    <span class="text-sm" data-i18n="q1_title">افعل الآن</span>
                    <span class="status-badge border border-red-500/20" data-i18n="q1_badge">عاجل / هام</span>
                </h3>
                <div id="list-do" class="space-y-3 min-h-[140px]"></div>
            </div>

            <div class="glass-card p-6 rounded-[2.5rem] box-schedule relative overflow-hidden">
                <h3 class="title-schedule font-bold mb-6 flex justify-between items-center">
                    <span class="text-sm" data-i18n="q2_title">خطط لها</span>
                    <span class="status-badge border border-blue-500/20" data-i18n="q2_badge">غير عاجل / هام</span>
                </h3>
                <div id="list-schedule" class="space-y-3 min-h-[140px]"></div>
            </div>

            <div class="glass-card p-6 rounded-[2.5rem] box-delegate relative overflow-hidden">
                <h3 class="title-delegate font-bold mb-6 flex justify-between items-center">
                    <span class="text-sm" data-i18n="q3_title">فوّضها</span>
                    <span class="status-badge border border-orange-500/20" data-i18n="q3_badge">عاجل / غير هام</span>
                </h3>
                <div id="list-delegate" class="space-y-3 min-h-[140px]"></div>
            </div>

            <div class="glass-card p-6 rounded-[2.5rem] box-delete relative overflow-hidden">
                <h3 class="title-delete font-bold mb-6 flex justify-between items-center">
                    <span class="text-sm" data-i18n="q4_title">احذفها</span>
                    <span class="status-badge border border-gray-500/20" data-i18n="q4_badge">غير عاجل / غير هام</span>
                </h3>
                <div id="list-delete" class="space-y-3 min-h-[140px]"></div>
            </div>
        </div>
    </main>

    <script>
        const MATRIX_KEY = 'astra_matrix_tasks';
        let tasks = JSON.parse(localStorage.getItem(MATRIX_KEY)) || [];

        const translations = {
            ar: {
                rate_label: "مستوى الإنجاز",
                session_label: "تحليل المصفوفة",
                input_placeholder: "أضف مهمة جديدة للمصفوفة...",
                add_btn: "إضافة",
                opt_do: "🔴 عاجل وهام",
                opt_schedule: "🔵 خطط لها",
                opt_delegate: "🟠 فوّضها",
                opt_delete: "⚪ احذفها",
                q1_title: "افعل الآن",
                q1_badge: "عاجل / هام",
                q2_title: "خطط لها",
                q2_badge: "غير عاجل / هام",
                q3_title: "فوّضها",
                q3_badge: "عاجل / غير هام",
                q4_title: "احذفها",
                q4_badge: "غير عاجل / غير هام"
            },
            en: {
                rate_label: "Completion Rate",
                session_label: "Matrix Analysis",
                input_placeholder: "Add new task to matrix...",
                add_btn: "Add",
                opt_do: "🔴 Do Now",
                opt_schedule: "🔵 Schedule",
                opt_delegate: "🟠 Delegate",
                opt_delete: "⚪ Delete",
                q1_title: "Do Now",
                q1_badge: "Urgent / Important",
                q2_title: "Schedule",
                q2_badge: "Not Urgent / Important",
                q3_title: "Delegate",
                q3_badge: "Urgent / Not Important",
                q4_title: "Delete",
                q4_badge: "Not Urgent / Not Important"
            }
        };

        function updateLanguage() {
            const savedLang = localStorage.getItem('astra_lang') || 'ar';
            const lang = translations[savedLang] || translations.ar;
            document.documentElement.lang = savedLang;
            document.documentElement.dir = savedLang === 'ar' ? 'rtl' : 'ltr';

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (lang[key]) el.innerText = lang[key];
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (lang[key]) el.placeholder = lang[key];
            });
        }

        function applyTheme() {
            const theme = JSON.parse(localStorage.getItem('astra_theme_data'));
            if (theme) {
                // تحديث اللون الأساسي في CSS variables
                document.documentElement.style.setProperty('--primary-color', theme.accent);
                
                // تحديث الخلفية بناءً على الثيم المختار
                if (theme.background) {
                    document.body.style.background = theme.background;
                } else {
                    const bgValue = `radial-gradient(circle at top right, ${theme.accent}44, #000 70%)`;
                    document.documentElement.style.setProperty('--bg-gradient', bgValue);
                    document.body.style.background = bgValue;
                }
                
                // تحديث تأثير الظل لزر الإضافة
                const btn = document.getElementById('add-btn');
                if(btn) btn.style.boxShadow = `0 10px 25px -5px ${theme.accent}66`;
            }
            updateStats();
        }

        function renderTasks() {
            const quads = ['do', 'schedule', 'delegate', 'delete'];
            quads.forEach(id => {
                const el = document.getElementById('list-' + id);
                if(el) el.innerHTML = '';
            });

            tasks.forEach((t, i) => {
                const quad = t.quadrant || 'do'; 
                const list = document.getElementById('list-' + quad);
                
                if (list) {
                    const item = document.createElement('div');
                    item.className = `task-item p-4 rounded-2xl flex items-center justify-between ${t.completed ? 'opacity-40' : ''}`;
                    item.style.animationDelay = `${i * 0.05}s`;
                    
                    item.innerHTML = `
                        <div class="flex items-center gap-4 flex-1">
                            <div class="relative flex items-center justify-center h-6 w-6">
                                <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${i})" 
                                    class="w-6 h-6 rounded-lg cursor-pointer accent-indigo-500 appearance-none border-2 border-white/20 checked:bg-indigo-500 checked:border-transparent transition-all">
                                ${t.completed ? '<svg class="absolute w-4 h-4 text-white pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>' : ''}
                            </div>
                            <span class="text-sm font-medium ${t.completed ? 'line-through opacity-50' : ''}">${t.text}</span>
                        </div>
                        <button onclick="deleteWithAnimation(this, ${i})" class="text-white/20 hover:text-red-500 transition-colors p-2 hover:bg-red-500/10 rounded-xl ml-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    `;
                    list.appendChild(item);
                }
            });
            updateStats();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const quad = document.getElementById('quadSelect').value;
            if (input.value.trim()) {
                tasks.unshift({ 
                    text: input.value.trim(), 
                    quadrant: quad, 
                    completed: false,
                    id: Date.now()
                });
                input.value = '';
                save();
            }
        }

        function toggleTask(i) { 
            tasks[i].completed = !tasks[i].completed; 
            save(); 
        }

        function deleteWithAnimation(btn, i) {
            const item = btn.closest('.task-item');
            item.style.transform = 'scale(0.8) rotate(5deg)';
            item.style.opacity = '0';
            setTimeout(() => {
                tasks.splice(i, 1);
                save();
            }, 300);
        }

        function save() { 
            localStorage.setItem(MATRIX_KEY, JSON.stringify(tasks)); 
            renderTasks(); 
        }

        function updateStats() {
            const done = tasks.filter(t => t.completed).length;
            const rate = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
            
            const rateEl = document.getElementById('comp-rate');
            let startValue = parseInt(rateEl.innerText) || 0;
            
            // Animation for the number
            let current = startValue;
            const step = rate > startValue ? 1 : -1;
            const interval = setInterval(() => {
                if (current === rate) {
                    clearInterval(interval);
                } else {
                    current += step;
                    rateEl.innerText = current + '%';
                }
            }, 10);
            
            const glow = document.getElementById('stat-glow');
            const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--primary-color');
            if(glow) {
                glow.style.boxShadow = `0 0 ${15 + (rate/4)}px ${primaryColor}`;
                glow.style.borderColor = rate === 100 ? '#4ade80' : primaryColor;
            }
        }

        // Event Listeners
        window.addEventListener('load', () => {
            updateLanguage();
            applyTheme();
            renderTasks();
        });

        document.getElementById('taskInput').addEventListener('keypress', (e) => { 
            if (e.key === 'Enter') addTask(); 
        });

        window.addEventListener('storage', (e) => {
            if (e.key === 'astra_theme_data') applyTheme();
            if (e.key === 'astra_lang') updateLanguage();
            if (e.key === MATRIX_KEY) {
                tasks = JSON.parse(e.newValue) || [];
                renderTasks();
            }
        });
    </script>
</body>
</html>
