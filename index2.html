<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra Matrix - إدارة المهام</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #6366f1; /* اللون الافتراضي - أزرق أسترا */
        }

        body { 
            background: #000; 
            background-image: radial-gradient(circle at top right, #1a1a2e, #000);
            background-attachment: fixed; 
            min-height: 100vh; 
            font-family: 'Tajawal', sans-serif;
            color: white;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .glass-card { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }

        .task-item {
            transition: all 0.3s ease;
            border-right: 2px solid transparent;
        }

        .task-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(-5px);
        }

        /* فئات الألوان الديناميكية */
        .text-primary { color: var(--primary-color); }
        .bg-primary { background-color: var(--primary-color); }
        .border-primary { border-color: var(--primary-color); }
        .accent-primary { accent-color: var(--primary-color); }
    </style>
</head>
<body class="p-6">

    <!-- Header -->
    <header class="max-w-4xl mx-auto flex justify-between items-center mb-8">
        <div class="flex items-center gap-4">
            <a href="index.html" class="p-3 glass-card rounded-2xl hover:bg-white/10 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
            </a>
            <h1 class="text-2xl font-black text-primary" id="main-logo">ASTRA MATRIX</h1>
        </div>
        
        <div class="flex items-center gap-6">
            <!-- اختيار الثيم -->
            <div class="flex gap-2 p-2 glass-card rounded-xl">
                <button onclick="setTheme('#6366f1')" class="w-4 h-4 rounded-full bg-[#6366f1]"></button>
                <button onclick="setTheme('#ec4899')" class="w-4 h-4 rounded-full bg-[#ec4899]"></button>
                <button onclick="setTheme('#22c55e')" class="w-4 h-4 rounded-full bg-[#22c55e]"></button>
                <button onclick="setTheme('#f59e0b')" class="w-4 h-4 rounded-full bg-[#f59e0b]"></button>
            </div>

            <div class="text-right">
                <p class="text-[10px] opacity-40 tracking-widest uppercase">معدل الإنجاز</p>
                <span id="comp-rate" class="text-2xl font-bold text-white">0%</span>
            </div>
        </div>
    </header>

    <!-- واجهة المصفوفة -->
    <div id="view-matrix" class="max-w-4xl mx-auto pb-24">
        <!-- منطقة إضافة المهمة -->
        <div class="glass-card p-3 rounded-2xl mb-8 flex flex-col sm:flex-row gap-2">
            <input type="text" id="taskInput" class="bg-transparent flex-grow p-3 outline-none text-white placeholder:text-white/20" placeholder="اكتب مهمة جديدة...">
            <div class="flex gap-2">
                <select id="quadSelect" class="bg-white/5 border-none px-4 rounded-xl text-xs outline-none cursor-pointer">
                    <option value="do">عاجل وهام</option>
                    <option value="schedule">خطط لها</option>
                    <option value="delegate">فوّضها</option>
                    <option value="delete">احذفها</option>
                </select>
                <button onclick="addTask()" class="bg-primary px-6 py-3 rounded-xl font-bold hover:opacity-90 transition-all shadow-lg shadow-indigo-500/10" id="add-btn">إضافة</button>
            </div>
        </div>

        <!-- المربعات الأربعة -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- الربع 1 -->
            <div class="glass-card p-5 rounded-3xl border-r-2 border-red-500/50">
                <h3 class="text-red-400 font-bold mb-4 text-sm flex items-center justify-between">
                    <span>🔴 افعل الآن (عاجل وهام)</span>
                    <span class="text-[10px] opacity-20">DO</span>
                </h3>
                <div id="list-do" class="space-y-2 min-h-[100px]"></div>
            </div>

            <!-- الربع 2 -->
            <div class="glass-card p-5 rounded-3xl border-r-2 border-blue-500/50">
                <h3 class="text-blue-400 font-bold mb-4 text-sm flex items-center justify-between">
                    <span>🔵 خطط لها (هام غير عاجل)</span>
                    <span class="text-[10px] opacity-20">SCHEDULE</span>
                </h3>
                <div id="list-schedule" class="space-y-2 min-h-[100px]"></div>
            </div>

            <!-- الربع 3 -->
            <div class="glass-card p-5 rounded-3xl border-r-2 border-orange-500/50">
                <h3 class="text-orange-400 font-bold mb-4 text-sm flex items-center justify-between">
                    <span>🟠 فوّضها (عاجل غير هام)</span>
                    <span class="text-[10px] opacity-20">DELEGATE</span>
                </h3>
                <div id="list-delegate" class="space-y-2 min-h-[100px]"></div>
            </div>

            <!-- الربع 4 -->
            <div class="glass-card p-5 rounded-3xl border-r-2 border-gray-500/50">
                <h3 class="text-gray-400 font-bold mb-4 text-sm flex items-center justify-between">
                    <span>⚪ احذفها (غير هام وعاجل)</span>
                    <span class="text-[10px] opacity-20">DELETE</span>
                </h3>
                <div id="list-delete" class="space-y-2 min-h-[100px]"></div>
            </div>
        </div>
    </div>

    <script>
        // إدارة البيانات والسمات
        let tasks = JSON.parse(localStorage.getItem('astra_tasks_pure')) || [];
        let currentTheme = localStorage.getItem('astra_theme') || '#6366f1';

        // دالة تغيير وحفظ الثيم
        function setTheme(color) {
            currentTheme = color;
            document.documentElement.style.setProperty('--primary-color', color);
            localStorage.setItem('astra_theme', color);
            
            // تحديث العناصر التي قد لا تستجيب للمتغيرات فوراً (مثل الظلال البرمجية)
            const addBtn = document.getElementById('add-btn');
            if(addBtn) addBtn.style.boxShadow = `0 10px 15px -3px ${color}33`;
        }

        function renderTasks() {
            // مسح القوائم الحالية
            ['do', 'schedule', 'delegate', 'delete'].forEach(id => {
                const el = document.getElementById('list-' + id);
                if(el) el.innerHTML = '';
            });

            // توزيع المهام
            tasks.forEach((t, i) => {
                const list = document.getElementById('list-' + t.quadrant);
                if (list) {
                    const item = document.createElement('div');
                    item.className = `task-item glass-card p-3 rounded-xl flex items-center justify-between ${t.completed ? 'opacity-30' : ''}`;
                    item.innerHTML = `
                        <div class="flex items-center gap-3">
                            <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${i})" class="w-4 h-4 accent-primary cursor-pointer">
                            <span class="text-sm ${t.completed ? 'line-through opacity-50' : ''}">${t.text}</span>
                        </div>
                        <button onclick="deleteTask(${i})" class="text-white/20 hover:text-red-500 transition-colors text-lg">✕</button>
                    `;
                    list.appendChild(item);
                }
            });

            // تحديث الإحصائيات
            const done = tasks.filter(t => t.completed).length;
            document.getElementById('comp-rate').innerText = (tasks.length ? Math.round((done / tasks.length) * 100) : 0) + '%';
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const quad = document.getElementById('quadSelect').value;
            if (input.value.trim()) {
                tasks.unshift({
                    text: input.value.trim(),
                    quadrant: quad,
                    completed: false,
                    id: Date.now()
                });
                input.value = '';
                save();
            }
        }

        function toggleTask(i) {
            tasks[i].completed = !tasks[i].completed;
            save();
        }

        function deleteTask(i) {
            tasks.splice(i, 1);
            save();
        }

        function save() {
            localStorage.setItem('astra_tasks_pure', JSON.stringify(tasks));
            renderTasks();
        }

        // تشغيل عند التحميل
        window.onload = () => {
            setTheme(currentTheme); // استعادة اللون المحفوظ
            renderTasks();
        };
    </script>
</body>
</html>
