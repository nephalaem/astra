<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Astra Matrix - إدارة المهام</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #6366f1; 
            /* توهج خافت جداً افتراضي */
            --bg-gradient: radial-gradient(circle at top right, #1e1b4b1a, #000 80%);
        }

        body { 
            background: var(--bg-gradient); 
            background-attachment: fixed; 
            min-height: 100vh; 
            font-family: 'Tajawal', sans-serif;
            color: white;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            transition: background 0.8s ease; /* انتقال أنعم */
        }
        
        /* شفافية زجاجية هادئة */
        .glass-card { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(30px) saturate(150%); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 4px 24px 0 rgba(0, 0, 0, 0.2);
        }

        .task-item {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .task-item:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: scale(1.01);
        }

        .svg-primary { stroke: var(--primary-color) !important; }
        
        #add-btn {
            background-color: var(--primary-color) !important;
            transition: all 0.3s ease;
        }

        .stat-circle {
            width: 60px;
            height: 60px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--primary-color);
            transition: all 0.5s ease;
        }

        /* مربعات المصفوفة بالعربية مع حدود رفيعة */
        .box-do { border-top: 2px solid #f87171cc !important; }
        .box-schedule { border-top: 2px solid #60a5facc !important; }
        .box-delegate { border-top: 2px solid #fb923ccc !important; }
        .box-delete { border-top: 2px solid #9ca3afcc !important; }

        .title-do { color: #f87171; }
        .title-schedule { color: #60a5fa; }
        .title-delegate { color: #fb923c; }
        .title-delete { color: #9ca3af; }

        .status-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.03);
            font-weight: bold;
        }

        select option { background: #000; color: white; }
        
        .check-custom {
            width: 20px;
            height: 20px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        /* أنيميشن بسيط عند إكمال المهمة */
        @keyframes success-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); border-color: var(--primary-color); }
            100% { transform: scale(1); }
        }
        .task-success { animation: success-pulse 0.4s ease-out; }
    </style>
    
    <script>
        // مزامنة الثيم مع تقليل التوهج (استخدام شفافية 15% بدلاً من 44%)
        function applyGlobalTheme() {
            const savedTheme = JSON.parse(localStorage.getItem('astra_theme_data'));
            if (savedTheme) {
                document.documentElement.style.setProperty('--primary-color', savedTheme.accent);
                // الشفافية هنا 1a (تعني حوالي 10%) لجعل الخلفية داكنة وهادئة
                const bgValue = `radial-gradient(circle at top right, ${savedTheme.accent}1a, #000 85%)`;
                document.documentElement.style.setProperty('--bg-gradient', bgValue);
            }
        }
        applyGlobalTheme();
    </script>
</head>
<body class="p-4 md:p-8">

    <header class="max-w-5xl mx-auto flex justify-between items-center mb-12">
        <div class="flex items-center gap-6">
            <a href="index.html" class="p-3 glass-card rounded-2xl hover:bg-white/10 transition-all group">
                <svg class="w-6 h-6 svg-primary group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
            </a>
            <h1 class="text-3xl font-black tracking-tighter" style="color: var(--primary-color);">ASTRA MATRIX</h1>
        </div>
        
        <div class="flex items-center gap-4 glass-card py-2 px-6 rounded-3xl">
            <div class="stat-circle" id="stat-glow">
                <span id="comp-rate" class="text-xl font-bold">0%</span>
            </div>
            <div class="text-right hidden sm:block">
                <p class="text-[10px] opacity-40 tracking-widest uppercase font-bold text-primary">المصفوفة</p>
                <p class="text-xs">تحليل الإنجاز</p>
            </div>
        </div>
    </header>

    <div id="view-matrix" class="max-w-5xl mx-auto pb-24">
        <!-- منطقة الإدخال -->
        <div class="glass-card p-2 rounded-[2rem] mb-10 flex flex-col md:flex-row gap-2">
            <input type="text" id="taskInput" class="bg-transparent flex-grow p-4 outline-none text-white placeholder:text-white/10 text-lg" placeholder="اكتب خطتك القادمة...">
            <div class="flex gap-2 p-1">
                <select id="quadSelect" class="bg-white/5 border-none px-4 rounded-2xl text-sm outline-none cursor-pointer text-white backdrop-blur-lg">
                    <option value="do">🔴 عاجل وهام</option>
                    <option value="schedule">🔵 خطط لها</option>
                    <option value="delegate">🟠 فوّضها</option>
                    <option value="delete">⚪ احذفها</option>
                </select>
                <button onclick="addTask()" class="px-10 py-4 rounded-2xl font-bold text-white shadow-lg active:scale-95 transition-all" id="add-btn">إضافة</button>
            </div>
        </div>

        <!-- الشبكة -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="glass-card p-6 rounded-[2.5rem] box-do relative">
                <h3 class="title-do font-bold mb-6 flex justify-between items-center text-sm">
                    <span>افعل الآن</span>
                    <span class="status-badge border border-red-500/10">مربع التنفيذ</span>
                </h3>
                <div id="list-do" class="space-y-3 min-h-[140px]"></div>
            </div>

            <div class="glass-card p-6 rounded-[2.5rem] box-schedule relative">
                <h3 class="title-schedule font-bold mb-6 flex justify-between items-center text-sm">
                    <span>خطط لها</span>
                    <span class="status-badge border border-blue-500/10">مربع الجدولة</span>
                </h3>
                <div id="list-schedule" class="space-y-3 min-h-[140px]"></div>
            </div>

            <div class="glass-card p-6 rounded-[2.5rem] box-delegate relative">
                <h3 class="title-delegate font-bold mb-6 flex justify-between items-center text-sm">
                    <span>فوّضها</span>
                    <span class="status-badge border border-orange-500/10">مربع التفويض</span>
                </h3>
                <div id="list-delegate" class="space-y-3 min-h-[140px]"></div>
            </div>

            <div class="glass-card p-6 rounded-[2.5rem] box-delete relative">
                <h3 class="title-delete font-bold mb-6 flex justify-between items-center text-sm">
                    <span>احذفها</span>
                    <span class="status-badge border border-gray-500/10">مربع الاستبعاد</span>
                </h3>
                <div id="list-delete" class="space-y-3 min-h-[140px]"></div>
            </div>
        </div>
    </div>

    <script>
        const MATRIX_KEY = 'astra_matrix_tasks';
        let tasks = JSON.parse(localStorage.getItem(MATRIX_KEY)) || [];
        
        // نظام الصوت (يتم توليده برمجياً ليكون خفيفاً)
        function playSuccessSound() {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = context.createOscillator();
            const gainNode = context.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(523.25, context.currentTime); // C5
            oscillator.frequency.exponentialRampToValueAtTime(880, context.currentTime + 0.1); // A5
            
            gainNode.gain.setValueAtTime(0.1, context.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, context.currentTime + 0.3);

            oscillator.connect(gainNode);
            gainNode.connect(context.destination);

            oscillator.start();
            oscillator.stop(context.currentTime + 0.3);
        }

        function applyTheme() {
            const theme = JSON.parse(localStorage.getItem('astra_theme_data'));
            if (theme) {
                document.documentElement.style.setProperty('--primary-color', theme.accent);
                const bgValue = `radial-gradient(circle at top right, ${theme.accent}1a, #000 85%)`;
                document.documentElement.style.setProperty('--bg-gradient', bgValue);
                const btn = document.getElementById('add-btn');
                if(btn) btn.style.boxShadow = `0 10px 20px -10px ${theme.accent}`;
                
                const glow = document.getElementById('stat-glow');
                if(glow) glow.style.borderColor = theme.accent;
            }
        }

        function renderTasks() {
            ['do', 'schedule', 'delegate', 'delete'].forEach(id => {
                const el = document.getElementById('list-' + id);
                if(el) el.innerHTML = '';
            });

            tasks.forEach((t, i) => {
                const quad = t.quadrant || 'do'; 
                const list = document.getElementById('list-' + quad);
                
                if (list) {
                    const item = document.createElement('div');
                    item.id = `task-${i}`;
                    item.className = `task-item p-4 rounded-2xl flex items-center justify-between ${t.completed ? 'opacity-30 grayscale' : ''}`;
                    item.innerHTML = `
                        <div class="flex items-center gap-4">
                            <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${i})" class="check-custom">
                            <span class="text-sm font-medium ${t.completed ? 'line-through' : ''}">${t.text}</span>
                        </div>
                        <button onclick="deleteTask(${i})" class="text-white/10 hover:text-red-500 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    `;
                    list.appendChild(item);
                }
            });
            updateStats();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const quad = document.getElementById('quadSelect').value;
            if (input.value.trim()) {
                tasks.unshift({ text: input.value.trim(), quadrant: quad, completed: false });
                input.value = '';
                save();
            }
        }

        function toggleTask(i) { 
            tasks[i].completed = !tasks[i].completed; 
            if(tasks[i].completed) {
                playSuccessSound();
                document.getElementById(`task-${i}`).classList.add('task-success');
            }
            save(); 
        }

        function deleteTask(i) { tasks.splice(i, 1); save(); }
        function save() { localStorage.setItem(MATRIX_KEY, JSON.stringify(tasks)); renderTasks(); }

        function updateStats() {
            const done = tasks.filter(t => t.completed).length;
            const rate = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
            document.getElementById('comp-rate').innerText = rate + '%';
            
            const glow = document.getElementById('stat-glow');
            if(glow) {
                glow.style.boxShadow = `0 0 ${10 + (rate/6)}px var(--primary-color)33`;
                glow.style.background = `rgba(255,255,255,${0.03 + (rate/1000)})`;
            }
        }

        window.addEventListener('load', () => {
            applyTheme();
            renderTasks();
        });

        window.addEventListener('storage', (e) => {
            if (e.key === 'astra_theme_data') applyTheme();
            if (e.key === MATRIX_KEY) {
                tasks = JSON.parse(e.newValue) || [];
                renderTasks();
            }
        });

        document.getElementById('taskInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(); });
    </script>
</body>
</html>
