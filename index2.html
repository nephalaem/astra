<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Astra Matrix Pro - نظام إدارة الأولويات</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #6366f1; 
            --bg-gradient: radial-gradient(circle at top right, #1e1b4b, #000);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.08);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 5px var(--primary-color); }
            50% { box-shadow: 0 0 20px var(--primary-color); }
            100% { box-shadow: 0 0 5px var(--primary-color); }
        }

        @keyframes taskIn {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        body { 
            background: var(--bg-gradient); 
            background-attachment: fixed; 
            min-height: 100vh; 
            font-family: 'Tajawal', 'Inter', sans-serif;
            color: white;
            margin: 0;
            overflow-x: hidden;
            transition: background 0.8s ease;
        }
        
        .glass-card { 
            background: var(--glass); 
            backdrop-filter: blur(20px) saturate(160%); 
            border: 1px solid var(--border); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s ease-out forwards;
        }

        .task-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: taskIn 0.3s ease-out forwards;
        }

        .task-item:hover {
            background: var(--glass-hover);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .stat-circle {
            width: 70px;
            height: 70px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid var(--primary-color);
            transition: all 0.5s ease;
            animation: pulseGlow 4s infinite ease-in-out;
        }

        .box-do { border-top: 4px solid #ef4444 !important; }
        .box-schedule { border-top: 4px solid #3b82f6 !important; }
        .box-delegate { border-top: 4px solid #f59e0b !important; }
        .box-delete { border-top: 4px solid #6b7280 !important; }

        .title-do { color: #f87171; }
        .title-schedule { color: #60a5fa; }
        .title-delegate { color: #fb923c; }
        .title-delete { color: #9ca3af; }

        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .btn-action { transition: all 0.2s ease; }
        .btn-action:active { transform: scale(0.92); }
    </style>

    <script>
        // تطبيق اللغة والسمة فوراً قبل تحميل الصفحة
        (function() {
            const savedTheme = JSON.parse(localStorage.getItem('astra_theme_data'));
            if (savedTheme) {
                document.documentElement.style.setProperty('--primary-color', savedTheme.accent);
            }
            const savedLang = localStorage.getItem('astra_lang') || 'ar';
            document.documentElement.lang = savedLang;
            document.documentElement.dir = savedLang === 'ar' ? 'rtl' : 'ltr';
        })();
    </script>
</head>
<body class="p-4 md:p-10">

    <header class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6 mb-12">
        <div class="flex items-center gap-6">
            <button onclick="window.history.back()" class="p-3 glass-card rounded-2xl hover:bg-white/10 transition-all group">
                <svg class="w-6 h-6 text-indigo-400 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
            </button>
            <div>
                <h1 class="text-4xl font-black tracking-tight" style="color: var(--primary-color); text-shadow: 0 0 20px rgba(99, 102, 241, 0.3);">ASTRA MATRIX</h1>
                <p class="text-[10px] opacity-40 tracking-[0.2em] font-bold uppercase mt-1" id="matrix-slogan">Professional Task Architecture</p>
            </div>
        </div>
        
        <div class="flex items-center gap-6">
            <div class="flex flex-col items-end">
                <div class="flex gap-2 mb-2">
                    <button onclick="setFilter('all')" id="filter-all" class="text-[10px] px-3 py-1 rounded-full border border-white/10 bg-white/5 hover:bg-white/10 transition-all opacity-100">الكل</button>
                    <button onclick="setFilter('active')" id="filter-active" class="text-[10px] px-3 py-1 rounded-full border border-white/10 bg-white/5 hover:bg-white/10 transition-all opacity-50">قيد التنفيذ</button>
                </div>
                <div class="flex items-center gap-4 glass-card py-3 px-6 rounded-[2rem]">
                    <div class="stat-circle" id="stat-glow">
                        <span id="comp-rate" class="text-2xl font-black italic">0%</span>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] opacity-40 tracking-widest uppercase font-bold" id="total-rate-label">الإنجاز الكلي</p>
                        <p id="task-count" class="text-xs font-medium">0 مهام</p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto space-y-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
            <div class="lg:col-span-8 glass-card p-2 rounded-3xl flex flex-col md:flex-row gap-2">
                <input type="text" id="taskInput" class="bg-transparent flex-grow p-4 outline-none text-white placeholder:text-white/20 text-lg" placeholder="ما هي المهمة التالية؟">
                <div class="flex gap-2 p-1">
                    <select id="quadSelect" class="bg-white/5 border border-white/10 px-4 rounded-2xl text-sm outline-none cursor-pointer text-white backdrop-blur-md hover:bg-white/10 transition-all">
                        </select>
                    <button onclick="addTask()" class="btn-action px-10 py-4 rounded-2xl font-black text-white shadow-lg bg-indigo-600 hover:bg-indigo-500" id="add-btn">إضافة</button>
                </div>
            </div>
            
            <div class="lg:col-span-4 glass-card p-2 rounded-3xl flex items-center px-4">
                <svg class="w-5 h-5 opacity-30 ml-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-width="2" stroke-linecap="round"/></svg>
                <input type="text" id="searchInput" oninput="renderTasks()" class="bg-transparent w-full p-3 outline-none text-sm" placeholder="بحث في المصفوفة...">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="glass-card p-6 rounded-[2.5rem] box-do group">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="title-do font-black flex items-center gap-2" id="h-do"><span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>افعل الآن</h3>
                    <span class="text-[10px] font-bold py-1 px-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400" id="p-do">P1: عاجل / هام</span>
                </div>
                <div id="list-do" class="space-y-3 min-h-[160px] max-h-[400px] overflow-y-auto custom-scrollbar pr-2"></div>
            </div>

            <div class="glass-card p-6 rounded-[2.5rem] box-schedule">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="title-schedule font-black flex items-center gap-2" id="h-schedule"><span class="w-2 h-2 rounded-full bg-blue-500"></span>خطط لها</h3>
                    <span class="text-[10px] font-bold py-1 px-3 rounded-lg bg-blue-500/10 border border-blue-500/20 text-blue-400" id="p-schedule">P2: غير عاجل / هام</span>
                </div>
                <div id="list-schedule" class="space-y-3 min-h-[160px] max-h-[400px] overflow-y-auto custom-scrollbar pr-2"></div>
            </div>

            <div class="glass-card p-6 rounded-[2.5rem] box-delegate">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="title-delegate font-black flex items-center gap-2" id="h-delegate"><span class="w-2 h-2 rounded-full bg-orange-500"></span>فوّضها</h3>
                    <span class="text-[10px] font-bold py-1 px-3 rounded-lg bg-orange-500/10 border border-orange-500/20 text-orange-400" id="p-delegate">P3: عاجل / غير هام</span>
                </div>
                <div id="list-delegate" class="space-y-3 min-h-[160px] max-h-[400px] overflow-y-auto custom-scrollbar pr-2"></div>
            </div>

            <div class="glass-card p-6 rounded-[2.5rem] box-delete">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="title-delete font-black flex items-center gap-2" id="h-delete"><span class="w-2 h-2 rounded-full bg-gray-500"></span>احذفها</h3>
                    <span class="text-[10px] font-bold py-1 px-3 rounded-lg bg-gray-500/10 border border-gray-500/20 text-gray-400" id="p-delete">P4: غير عاجل / غير هام</span>
                </div>
                <div id="list-delete" class="space-y-3 min-h-[160px] max-h-[400px] overflow-y-auto custom-scrollbar pr-2"></div>
            </div>
        </div>
    </main>

    <script>
        const MATRIX_KEY = 'astra_matrix_tasks_pro';
        let tasks = JSON.parse(localStorage.getItem(MATRIX_KEY)) || [];
        let currentFilter = 'all';
        let currentLang = localStorage.getItem('astra_lang') || 'ar';

        const i18n = {
            ar: { slogan: "Professional Task Architecture", totalRate: "الإنجاز الكلي", placeholder: "ما هي المهمة التالية؟", search: "بحث في المصفوفة...", add: "إضافة", all: "الكل", active: "قيد التنفيذ", taskText: "مهام", doneText: "مكتملة", hDo: "افعل الآن", pDo: "P1: عاجل / هام", hSch: "خطط لها", pSch: "P2: غير عاجل / هام", hDel: "فوّضها", pDel: "P3: عاجل / غير هام", hRem: "احذفها", pRem: "P4: غير عاجل / غير هام", optDo: "🔴 عاجل وهام", optSch: "🔵 خطط لها", optDel: "🟠 فوّضها", optRem: "⚪ احذفها" },
            en: { slogan: "Professional Task Architecture", totalRate: "Total Rate", placeholder: "What's next?", search: "Search Matrix...", add: "Add", all: "All", active: "Active", taskText: "tasks", doneText: "done", hDo: "Do Now", pDo: "P1: Urgent / Imp", hSch: "Schedule", pSch: "P2: Not Urgent / Imp", hDel: "Delegate", pDel: "P3: Urgent / Not Imp", hRem: "Delete", pRem: "P4: Not Urgent / Not Imp", optDo: "🔴 Urgent/Important", optSch: "🔵 Schedule It", optDel: "🟠 Delegate It", optRem: "⚪ Delete It" },
            fr: { slogan: "Architecture de Tâches Pro", totalRate: "Taux Global", placeholder: "Quelle est la suite ?", search: "Rechercher...", add: "Ajouter", all: "Tout", active: "Actif", taskText: "tâches", doneText: "terminé", hDo: "Faire", pDo: "P1: Urgent / Imp", hSch: "Planifier", pSch: "P2: Non Urgent / Imp", hDel: "Déléguer", pDel: "P3: Urgent / Peu Imp", hRem: "Supprimer", pRem: "P4: Non Urgent / Peu Imp", optDo: "🔴 Urgent/Important", optSch: "🔵 Planifier", optDel: "🟠 Déléguer", optRem: "⚪ Supprimer" }
        };

        function applyLanguage() {
            const t = i18n[currentLang];
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';

            document.getElementById('matrix-slogan').innerText = t.slogan;
            document.getElementById('total-rate-label').innerText = t.totalRate;
            document.getElementById('taskInput').placeholder = t.placeholder;
            document.getElementById('searchInput').placeholder = t.search;
            document.getElementById('add-btn').innerText = t.add;
            document.getElementById('filter-all').innerText = t.all;
            document.getElementById('filter-active').innerText = t.active;

            document.getElementById('h-do').innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>${t.hDo}`;
            document.getElementById('p-do').innerText = t.pDo;
            document.getElementById('h-schedule').innerHTML = `<span class="w-2 h-2 rounded-full bg-blue-500"></span>${t.hSch}`;
            document.getElementById('p-schedule').innerText = t.pSch;
            document.getElementById('h-delegate').innerHTML = `<span class="w-2 h-2 rounded-full bg-orange-500"></span>${t.hDel}`;
            document.getElementById('p-delegate').innerText = t.pDel;
            document.getElementById('h-delete').innerHTML = `<span class="w-2 h-2 rounded-full bg-gray-500"></span>${t.hRem}`;
            document.getElementById('p-delete').innerText = t.pRem;

            const select = document.getElementById('quadSelect');
            select.innerHTML = `
                <option value="do">${t.optDo}</option>
                <option value="schedule">${t.optSch}</option>
                <option value="delegate">${t.optDel}</option>
                <option value="delete">${t.optRem}</option>
            `;
            updateStats();
        }

        function playSuccessSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1); 
                gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.3);
            } catch (e) {}
        }

        function applyTheme() {
            const themeData = localStorage.getItem('astra_theme_data');
            if (themeData) {
                const theme = JSON.parse(themeData);
                document.documentElement.style.setProperty('--primary-color', theme.accent);
                if (theme.bg) document.body.style.background = theme.bg;
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.getElementById('filter-all').style.opacity = filter === 'all' ? '1' : '0.5';
            document.getElementById('filter-active').style.opacity = filter === 'active' ? '1' : '0.5';
            renderTasks();
        }

        function renderTasks() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const quads = ['do', 'schedule', 'delegate', 'delete'];
            quads.forEach(id => {
                const el = document.getElementById('list-' + id);
                if(el) el.innerHTML = '';
            });

            const filteredTasks = tasks.filter(t => {
                const matchesSearch = t.text.toLowerCase().includes(searchQuery);
                const matchesFilter = currentFilter === 'all' || !t.completed;
                return matchesSearch && matchesFilter;
            });

            filteredTasks.forEach((t) => {
                const quad = t.quadrant || 'do'; 
                const list = document.getElementById('list-' + quad);
                if (list) {
                    const index = tasks.findIndex(task => task.id === t.id);
                    const item = document.createElement('div');
                    item.className = `task-item p-4 rounded-2xl flex items-center justify-between ${t.completed ? 'opacity-30' : ''}`;
                    const dateStr = new Date(t.id).toLocaleDateString(currentLang === 'ar' ? 'ar-EG' : 'en-US', { month: 'short', day: 'numeric' });

                    item.innerHTML = `
                        <div class="flex items-center gap-4 flex-1">
                            <div class="relative flex items-center justify-center h-6 w-6">
                                <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${index})" 
                                    class="w-6 h-6 rounded-lg cursor-pointer appearance-none border-2 border-white/10 checked:bg-indigo-500 checked:border-transparent transition-all">
                                ${t.completed ? '<svg class="absolute w-4 h-4 text-white pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>' : ''}
                            </div>
                            <div class="flex flex-col">
                                <span class="text-sm font-bold ${t.completed ? 'line-through' : ''}">${t.text}</span>
                                <span class="text-[9px] opacity-30 font-medium tracking-wider mt-0.5">${dateStr}</span>
                            </div>
                        </div>
                        <button onclick="deleteWithAnimation(this, ${index})" class="text-white/10 hover:text-red-400 transition-all p-2 hover:bg-red-500/10 rounded-xl">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    `;
                    list.appendChild(item);
                }
            });
            updateStats();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const quad = document.getElementById('quadSelect').value;
            if (input.value.trim()) {
                tasks.unshift({ text: input.value.trim(), quadrant: quad, completed: false, id: Date.now() });
                input.value = '';
                save();
            }
        }

        function toggleTask(i) { 
            const isMarkingAsDone = !tasks[i].completed;
            tasks[i].completed = isMarkingAsDone;
            if (isMarkingAsDone) playSuccessSound();
            save(); 
        }

        function deleteWithAnimation(btn, i) {
            const item = btn.closest('.task-item');
            if(item) {
                item.style.transform = 'translateX(50px) scale(0.9)';
                item.style.opacity = '0';
                setTimeout(() => {
                    tasks.splice(i, 1);
                    save();
                }, 300);
            }
        }

        function save() { 
            localStorage.setItem(MATRIX_KEY, JSON.stringify(tasks)); 
            renderTasks(); 
        }

        function updateStats() {
            const done = tasks.filter(t => t.completed).length;
            const total = tasks.length;
            const rate = total ? Math.round((done / total) * 100) : 0;
            const t = i18n[currentLang];
            
            document.getElementById('comp-rate').innerText = rate + '%';
            document.getElementById('task-count').innerText = `${total} ${t.taskText} | ${done} ${t.doneText}`;
            
            const glow = document.getElementById('stat-glow');
            const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--primary-color').trim() || '#6366f1';
            if(glow) {
                glow.style.boxShadow = `0 0 ${10 + (rate/5)}px ${primaryColor}55`;
                glow.style.borderColor = rate === 100 ? '#4ade80' : primaryColor;
            }
        }

        window.onload = () => { 
            applyTheme(); 
            applyLanguage();
            renderTasks(); 
        };
        document.getElementById('taskInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') addTask(); });
    </script>
</body>
</html>
