<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra V2 - Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background: #000; 
            background-image: radial-gradient(circle at top right, #1a1a2e, #000);
            background-attachment: fixed; 
            min-height: 100vh; 
            font-family: 'Tajawal', sans-serif;
            color: white;
            margin: 0;
            overflow-x: hidden;
        }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* تصميم البكرات Picker */
        .picker-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            height: 200px;
            position: relative;
        }
        .picker-column {
            width: 70px;
            height: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            mask-image: linear-gradient(to bottom, transparent, black 40%, black 60%, transparent);
        }
        .picker-column::-webkit-scrollbar { display: none; }
        .picker-item {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            opacity: 0.2;
            scroll-snap-align: center;
            transition: 0.3s;
        }
        .picker-item.active { opacity: 1; color: #818cf8; transform: scale(1.2); font-weight: bold; }

        /* دائرة المؤقت */
        .timer-svg { transform: rotate(-90deg); width: 260px; height: 260px; }
        .timer-circle-bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 3; }
        .timer-circle-prog { 
            fill: none; stroke: #6366f1; stroke-width: 3; stroke-linecap: round; 
            transition: stroke-dashoffset 0.5s linear;
        }

        .hidden { display: none !important; }
        
        /* زر التنقل السفلي */
        .nav-bar {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }
        .nav-btn { opacity: 0.4; transition: 0.3s; }
        .nav-btn.active { opacity: 1; color: #818cf8; }
    </style>
</head>
<body class="p-6">

    <!-- Header -->
    <header class="max-w-4xl mx-auto flex justify-between items-center mb-8">
        <div class="flex items-center gap-4">
            <a href="index.html" class="p-3 glass-card rounded-2xl hover:bg-white/10 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </a>
            <!-- مربع الساعة المصغر الشفاف (يظهر فقط في المصفوفة) -->
            <div id="mini-timer-shortcut" onclick="switchMode('timer')" class="glass-card px-4 py-2 rounded-2xl cursor-pointer hover:bg-white/10 flex items-center gap-3">
                <div class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></div>
                <span id="mini-time" class="font-mono font-bold text-lg">00:00</span>
            </div>
        </div>
        <div class="text-right">
            <h1 id="page-title" class="text-2xl font-black text-indigo-400">ASTRA MATRIX</h1>
            <p id="stats-label" class="text-[10px] opacity-40 tracking-widest uppercase">إنجازك: <span id="comp-rate">0%</span></p>
        </div>
    </header>

    <!-- واجهة المصفوفة (صفحة مستقلة) -->
    <div id="view-matrix" class="max-w-4xl mx-auto animate-in fade-in duration-500 pb-24">
        <div class="glass-card p-3 rounded-2xl mb-8 flex gap-2">
            <input type="text" id="taskInput" class="bg-transparent flex-grow p-3 outline-none text-white placeholder:text-white/20" placeholder="مهمة جديدة...">
            <select id="quadSelect" class="bg-transparent border-l border-white/10 px-2 text-xs outline-none">
                <option value="do">عاجل وهام</option>
                <option value="schedule">خطط لها</option>
                <option value="delegate">فوّضها</option>
                <option value="delete">احذفها</option>
            </select>
            <button onclick="addTask()" class="bg-indigo-600 px-6 py-3 rounded-xl font-bold hover:bg-indigo-500">إضافة</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="glass-card p-5 rounded-3xl border-r-2 border-red-500/50">
                <h3 class="text-red-400 font-bold mb-4 text-sm flex items-center gap-2">🔴 افعل الآن</h3>
                <div id="list-do" class="space-y-2"></div>
            </div>
            <div class="glass-card p-5 rounded-3xl border-r-2 border-blue-500/50">
                <h3 class="text-blue-400 font-bold mb-4 text-sm flex items-center gap-2">🔵 خطط لها</h3>
                <div id="list-schedule" class="space-y-2"></div>
            </div>
            <div class="glass-card p-5 rounded-3xl border-r-2 border-orange-500/50">
                <h3 class="text-orange-400 font-bold mb-4 text-sm flex items-center gap-2">🟠 فوّضها</h3>
                <div id="list-delegate" class="space-y-2"></div>
            </div>
            <div class="glass-card p-5 rounded-3xl border-r-2 border-gray-500/50">
                <h3 class="text-gray-400 font-bold mb-4 text-sm flex items-center gap-2">⚪ احذفها</h3>
                <div id="list-delete" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <!-- واجهة الساعة (صفحة مستقلة تماماً) -->
    <div id="view-timer" class="hidden max-w-md mx-auto animate-in fade-in duration-500 pb-24 text-center">
        <!-- بكرات الاختيار -->
        <div id="timer-setup">
            <div class="picker-wrapper mb-10">
                <div class="picker-column" id="p-h"></div>
                <span class="text-2xl font-bold opacity-20">:</span>
                <div class="picker-column" id="p-m"></div>
                <span class="text-2xl font-bold opacity-20">:</span>
                <div class="picker-column" id="p-s"></div>
            </div>
        </div>

        <!-- العرض الدائري عند التشغيل -->
        <div id="timer-running" class="hidden relative flex justify-center mb-10">
            <svg class="timer-svg" viewBox="0 0 100 100">
                <circle class="timer-circle-bg" cx="50" cy="50" r="48"></circle>
                <circle id="prog-circle" class="timer-circle-prog" cx="50" cy="50" r="48" stroke-dasharray="301.59" stroke-dashoffset="0"></circle>
            </svg>
            <div class="absolute inset-0 flex items-center justify-center">
                <span id="big-time" class="text-5xl font-mono font-bold">00:00:00</span>
            </div>
        </div>

        <!-- أزرار التحكم -->
        <div class="flex justify-center gap-8 mb-12">
            <button onclick="toggleTimer()" id="btn-play" class="w-16 h-16 rounded-full bg-indigo-600 flex items-center justify-center hover:scale-105 transition-all">
                <svg id="svg-play" class="w-6 h-6 fill-white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="svg-pause" class="w-6 h-6 fill-white hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button onclick="resetTimer()" class="w-16 h-16 rounded-full glass-card flex items-center justify-center hover:bg-white/10">
                <svg class="w-5 h-5 stroke-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            </button>
        </div>

        <!-- مهام مخصصة (كما في صورة 3) -->
        <div class="text-right space-y-3">
            <h4 class="text-[10px] opacity-30 font-bold uppercase tracking-widest pr-2">مؤقتات مخصصة لمهامك</h4>
            <div onclick="quickStart(2, 'تنظيف الأسنان')" class="glass-card p-4 rounded-2xl flex justify-between items-center cursor-pointer hover:bg-white/10 transition-all">
                <div class="flex items-center gap-3"><span>🪥</span> <span class="font-bold text-sm">تنظيف الأسنان</span></div>
                <span class="opacity-40 font-mono text-xs">02:00</span>
            </div>
            <div onclick="quickStart(10, 'سلق البيض')" class="glass-card p-4 rounded-2xl flex justify-between items-center cursor-pointer hover:bg-white/10 transition-all">
                <div class="flex items-center gap-3"><span>🥚</span> <span class="font-bold text-sm">سلق البيض</span></div>
                <span class="opacity-40 font-mono text-xs">10:00</span>
            </div>
            <div onclick="quickStart(25, 'جلسة تركيز')" class="glass-card p-4 rounded-2xl flex justify-between items-center cursor-pointer hover:bg-white/10 transition-all border-l-2 border-indigo-500">
                <div class="flex items-center gap-3"><span>🧠</span> <span class="font-bold text-sm">جلسة تركيز Astra</span></div>
                <span class="opacity-40 font-mono text-xs">25:00</span>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="nav-bar glass-card p-1 rounded-2xl flex gap-1">
        <button onclick="switchMode('matrix')" id="nav-matrix" class="nav-btn px-8 py-3 rounded-xl flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" stroke-width="2" stroke-linecap="round"/></svg>
            <span class="text-xs font-bold">المصفوفة</span>
        </button>
        <button onclick="switchMode('timer')" id="nav-timer" class="nav-btn px-8 py-3 rounded-xl flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8v4l3 3" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke-width="2"/></svg>
            <span class="text-xs font-bold">المؤقت</span>
        </button>
    </nav>

    <script>
        // --- إدارة الحالة ---
        let currentMode = 'matrix';
        let tasks = JSON.parse(localStorage.getItem('astra_tasks_v2')) || [];

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('view-matrix').classList.toggle('hidden', mode !== 'matrix');
            document.getElementById('view-timer').classList.toggle('hidden', mode !== 'timer');
            document.getElementById('mini-timer-shortcut').classList.toggle('hidden', mode !== 'matrix');
            document.getElementById('stats-label').classList.toggle('hidden', mode !== 'matrix');
            document.getElementById('page-title').innerText = mode === 'matrix' ? 'ASTRA MATRIX' : 'ASTRA TIMER';
            
            document.getElementById('nav-matrix').classList.toggle('active', mode === 'matrix');
            document.getElementById('nav-timer').classList.toggle('active', mode === 'timer');
            if(mode === 'matrix') renderTasks();
        }

        // --- نظام الـ Picker ---
        function initPicker(id, max) {
            const el = document.getElementById(id);
            for(let i=-2; i<=max+2; i++) {
                const item = document.createElement('div');
                item.className = 'picker-item';
                if(i>=0 && i<=max) {
                    item.innerText = i.toString().padStart(2, '0');
                    item.dataset.val = i;
                }
                el.appendChild(item);
            }
            el.addEventListener('scroll', () => {
                const items = el.querySelectorAll('.picker-item');
                items.forEach(it => {
                    const rect = it.getBoundingClientRect();
                    const center = el.getBoundingClientRect().top + 100;
                    if(Math.abs(rect.top + 25 - center) < 25) {
                        items.forEach(x => x.classList.remove('active'));
                        it.classList.add('active');
                    }
                });
            });
            el.scrollTop = 0;
        }

        initPicker('p-h', 23); initPicker('p-m', 59); initPicker('p-s', 59);

        // --- منطق المؤقت ---
        let timeLeft = 0, totalTime = 0, timerInt = null;

        function toggleTimer() {
            if(timerInt) {
                clearInterval(timerInt); timerInt = null;
                updateUI(false);
            } else {
                if(timeLeft <= 0) {
                    const h = parseInt(document.querySelector('#p-h .active')?.dataset.val || 0);
                    const m = parseInt(document.querySelector('#p-m .active')?.dataset.val || 0);
                    const s = parseInt(document.querySelector('#p-s .active')?.dataset.val || 0);
                    timeLeft = (h * 3600) + (m * 60) + s;
                    totalTime = timeLeft;
                }
                if(timeLeft <= 0) return;

                document.getElementById('timer-setup').classList.add('hidden');
                document.getElementById('timer-running').classList.remove('hidden');
                updateUI(true);

                timerInt = setInterval(() => {
                    if(timeLeft > 0) {
                        timeLeft--; updateDisplay();
                    } else {
                        clearInterval(timerInt); timerInt = null;
                        alert("انتهى المؤقت!"); resetTimer();
                    }
                }, 1000);
            }
        }

        function updateDisplay() {
            const h = Math.floor(timeLeft/3600).toString().padStart(2,'0');
            const m = Math.floor((timeLeft%3600)/60).toString().padStart(2,'0');
            const s = (timeLeft%60).toString().padStart(2,'0');
            const timeStr = `${h}:${m}:${s}`;
            document.getElementById('big-time').innerText = timeStr;
            document.getElementById('mini-time').innerText = `${m}:${s}`;
            const offset = 301.59 - (timeLeft/totalTime) * 301.59;
            document.getElementById('prog-circle').style.strokeDashoffset = offset;
        }

        function updateUI(run) {
            document.getElementById('svg-play').classList.toggle('hidden', run);
            document.getElementById('svg-pause').classList.toggle('hidden', !run);
        }

        function resetTimer() {
            clearInterval(timerInt); timerInt = null;
            timeLeft = 0;
            document.getElementById('timer-setup').classList.remove('hidden');
            document.getElementById('timer-running').classList.add('hidden');
            document.getElementById('mini-time').innerText = "00:00";
            updateUI(false);
        }

        function quickStart(mins, label) {
            resetTimer();
            timeLeft = mins * 60; totalTime = timeLeft;
            toggleTimer();
        }

        // --- منطق المصفوفة ---
        function renderTasks() {
            ['do','schedule','delegate','delete'].forEach(id => document.getElementById('list-'+id).innerHTML='');
            tasks.forEach((t, i) => {
                const list = document.getElementById('list-'+t.quadrant);
                const d = document.createElement('div');
                d.className = `glass-card p-3 rounded-2xl flex items-center justify-between ${t.completed?'opacity-30':''}`;
                d.innerHTML = `
                    <div class="flex items-center gap-2">
                        <input type="checkbox" ${t.completed?'checked':''} onchange="toggleTask(${i})" class="w-4 h-4 accent-indigo-500">
                        <span class="text-xs ${t.completed?'line-through opacity-50':''}">${t.text}</span>
                    </div>
                    <button onclick="deleteTask(${i})" class="text-[10px] opacity-20 hover:opacity-100 transition-opacity">✕</button>
                `;
                list.appendChild(d);
            });
            const done = tasks.filter(t=>t.completed).length;
            document.getElementById('comp-rate').innerText = (tasks.length?Math.round((done/tasks.length)*100):0)+'%';
        }

        function addTask() {
            const val = document.getElementById('taskInput').value;
            if(val.trim()){
                tasks.unshift({text: val, quadrant: document.getElementById('quadSelect').value, completed: false});
                save(); document.getElementById('taskInput').value='';
            }
        }
        function toggleTask(i) { tasks[i].completed = !tasks[i].completed; save(); }
        function deleteTask(i) { tasks.splice(i, 1); save(); }
        function save() { localStorage.setItem('astra_tasks_v2', JSON.stringify(tasks)); renderTasks(); }

        window.onload = () => switchMode('matrix');
    </script>
</body>
</html>
