<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Astra Matrix - إدارة المهام</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #6366f1; 
            --bg-gradient: radial-gradient(circle at top right, #1e1b4b, #000);
        }

        body { 
            background: var(--bg-gradient); 
            background-attachment: fixed; 
            min-height: 100vh; 
            font-family: 'Tajawal', sans-serif;
            color: white;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            transition: background 0.5s ease;
        }
        
        /* تأثير الزجاج الشفاف المنسجم */
        .glass-card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px) saturate(180%); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .task-item {
            transition: all 0.3s ease;
        }

        .task-item:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateX(-5px);
        }

        .svg-primary { stroke: var(--primary-color) !important; }
        
        #add-btn {
            background-color: var(--primary-color) !important;
            transition: all 0.3s ease;
        }

        /* حدود ملونة للمصفوفة للحفاظ على الوظيفة البصرية */
        .box-do { border-right: 4px solid #f87171 !important; }
        .box-schedule { border-right: 4px solid #60a5fa !important; }
        .box-delegate { border-right: 4px solid #fb923c !important; }
        .box-delete { border-right: 4px solid #9ca3af !important; }

        .title-do { color: #f87171; }
        .title-schedule { color: #60a5fa; }
        .title-delegate { color: #fb923c; }
        .title-delete { color: #9ca3af; }

        .status-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.05);
            font-weight: bold;
        }

        select option { background: #1e1b4b; color: white; }
    </style>
    
    <script>
        // مزامنة الثيم فورياً قبل الرندر لضمان التناسق
        (function() {
            const savedTheme = JSON.parse(localStorage.getItem('astra_theme_data'));
            if (savedTheme) {
                document.documentElement.style.setProperty('--primary-color', savedTheme.accent);
                const bgValue = `radial-gradient(circle at top right, ${savedTheme.accent}33, #000)`;
                document.documentElement.style.setProperty('--bg-gradient', bgValue);
            }
        })();
    </script>
</head>
<body class="p-6">

    <header class="max-w-4xl mx-auto flex justify-between items-center mb-10">
        <div class="flex items-center gap-4">
            <a href="index.html" class="p-3 glass-card rounded-2xl hover:bg-white/10 transition-all">
                <svg class="w-6 h-6 svg-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
            </a>
            <h1 class="text-3xl font-black" style="color: var(--primary-color);">ASTRA MATRIX</h1>
        </div>
        
        <div class="flex items-center gap-6">
            <div class="text-right">
                <p class="text-[10px] opacity-40 tracking-widest uppercase">معدل الإنجاز</p>
                <span id="comp-rate" class="text-3xl font-bold">0%</span>
            </div>
        </div>
    </header>

    <div id="view-matrix" class="max-w-5xl mx-auto pb-24">
        <!-- إضافة المهمة -->
        <div class="glass-card p-2 rounded-3xl mb-10 flex flex-col md:flex-row gap-2">
            <input type="text" id="taskInput" class="bg-transparent flex-grow p-4 outline-none text-white placeholder:text-white/20 text-lg" placeholder="أضف مهمة للمصفوفة...">
            <div class="flex gap-2">
                <select id="quadSelect" class="bg-white/5 border-none px-4 rounded-xl text-sm outline-none cursor-pointer text-white backdrop-blur-lg">
                    <option value="do">🔴 عاجل وهام</option>
                    <option value="schedule">🔵 خطط لها</option>
                    <option value="delegate">🟠 فوّضها</option>
                    <option value="delete">⚪ احذفها</option>
                </select>
                <button onclick="addTask()" class="px-10 py-3 rounded-xl font-bold text-white shadow-lg active:scale-95 transition-all" id="add-btn">إضافة</button>
            </div>
        </div>

        <!-- شبكة المصفوفة -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="glass-card p-6 rounded-[32px] box-do">
                <h3 class="title-do font-bold mb-6 flex justify-between items-center">
                    <span>افعل الآن</span>
                    <span class="status-badge border border-red-500/30 text-red-400">عاجل / هام</span>
                </h3>
                <div id="list-do" class="space-y-3 min-h-[120px]"></div>
            </div>

            <div class="glass-card p-6 rounded-[32px] box-schedule">
                <h3 class="title-schedule font-bold mb-6 flex justify-between items-center">
                    <span>خطط لها</span>
                    <span class="status-badge border border-blue-500/30 text-blue-400">غير عاجل / هام</span>
                </h3>
                <div id="list-schedule" class="space-y-3 min-h-[120px]"></div>
            </div>

            <div class="glass-card p-6 rounded-[32px] box-delegate">
                <h3 class="title-delegate font-bold mb-6 flex justify-between items-center">
                    <span>فوّضها</span>
                    <span class="status-badge border border-orange-500/30 text-orange-400">عاجل / غير هام</span>
                </h3>
                <div id="list-delegate" class="space-y-3 min-h-[120px]"></div>
            </div>

            <div class="glass-card p-6 rounded-[32px] box-delete">
                <h3 class="title-delete font-bold mb-6 flex justify-between items-center">
                    <span>احذفها</span>
                    <span class="status-badge border border-gray-500/30 text-gray-400">غير عاجل / غير هام</span>
                </h3>
                <div id="list-delete" class="space-y-3 min-h-[120px]"></div>
            </div>
        </div>
    </div>

    <script>
        // تغيير المفتاح ليكون خاص بالمصفوفة فقط لمنع الخلط مع الواجهة الرئيسية
        const MATRIX_KEY = 'astra_matrix_tasks';
        let tasks = JSON.parse(localStorage.getItem(MATRIX_KEY)) || [];
        
        function applyTheme() {
            const theme = JSON.parse(localStorage.getItem('astra_theme_data'));
            if (theme) {
                document.documentElement.style.setProperty('--primary-color', theme.accent);
                const bgValue = `radial-gradient(circle at top right, ${theme.accent}33, #000)`;
                document.documentElement.style.setProperty('--bg-gradient', bgValue);
                const btn = document.getElementById('add-btn');
                if(btn) btn.style.boxShadow = `0 10px 20px -5px ${theme.accent}66`;
            }
        }

        function renderTasks() {
            ['do', 'schedule', 'delegate', 'delete'].forEach(id => {
                const el = document.getElementById('list-' + id);
                if(el) el.innerHTML = '';
            });

            tasks.forEach((t, i) => {
                const quad = t.quadrant || 'do'; 
                const list = document.getElementById('list-' + quad);
                
                if (list) {
                    const item = document.createElement('div');
                    item.className = `task-item glass-card p-4 rounded-2xl flex items-center justify-between ${t.completed ? 'opacity-30' : ''}`;
                    item.innerHTML = `
                        <div class="flex items-center gap-4">
                            <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${i})" class="w-5 h-5 cursor-pointer accent-indigo-500">
                            <span class="text-sm ${t.completed ? 'line-through opacity-50' : ''}">${t.text}</span>
                        </div>
                        <button onclick="deleteTask(${i})" class="text-white/20 hover:text-red-500 transition-colors">✕</button>
                    `;
                    list.appendChild(item);
                }
            });
            updateStats();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const quad = document.getElementById('quadSelect').value;
            if (input.value.trim()) {
                tasks.unshift({ text: input.value.trim(), quadrant: quad, completed: false });
                input.value = '';
                save();
            }
        }

        function toggleTask(i) { tasks[i].completed = !tasks[i].completed; save(); }
        function deleteTask(i) { tasks.splice(i, 1); save(); }
        function save() { localStorage.setItem(MATRIX_KEY, JSON.stringify(tasks)); renderTasks(); }

        function updateStats() {
            const done = tasks.filter(t => t.completed).length;
            const rate = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
            document.getElementById('comp-rate').innerText = rate + '%';
        }

        window.addEventListener('load', () => {
            applyTheme();
            renderTasks();
        });

        window.addEventListener('storage', (e) => {
            if (e.key === 'astra_theme_data') applyTheme();
            if (e.key === MATRIX_KEY) {
                tasks = JSON.parse(e.newValue) || [];
                renderTasks();
            }
        });
    </script>
</body>
</html>
