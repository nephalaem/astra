<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra V2 - Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); 
            background-attachment: fixed; 
            min-height: 100vh; 
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
        }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        
        /* تصميم المؤقت الدائري الشفاف */
        .timer-ring {
            width: 280px; height: 280px; border-radius: 50%;
            background: conic-gradient(#6366f1 var(--progress, 0%), rgba(255,255,255,0.05) 0deg);
            display: flex; align-items: center; justify-content: center; position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.2);
        }
        .timer-ring::after {
            content: ""; position: absolute; inset: 10px; background: #23215c; border-radius: 50%;
        }
        .timer-display { position: relative; z-index: 10; font-family: monospace; font-size: 4rem; font-weight: bold; color: white; }

        .hidden { display: none; }
        .quadrant { transition: all 0.3s ease; min-height: 250px; }
        
        /* تلوين الأقسام */
        .q-do { background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.2); }
        .q-schedule { background: rgba(59, 130, 246, 0.05); border: 1px solid rgba(59, 130, 246, 0.2); }
        .q-delegate { background: rgba(249, 115, 22, 0.05); border: 1px solid rgba(249, 115, 22, 0.2); }
        .q-delete { background: rgba(107, 114, 128, 0.08); border: 1px solid rgba(107, 114, 128, 0.2); }
    </style>
</head>
<body class="text-white p-6 md:p-10">

    <!-- Header المشترك -->
    <header class="max-w-6xl mx-auto flex justify-between items-center mb-10">
        <div class="flex items-center gap-6">
            <a href="index.html" class="p-3 glass-card rounded-2xl hover:bg-white/10 transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </a>
            <div id="matrix-stats">
                <span class="text-3xl font-bold" id="completion-rate">0%</span>
                <p class="text-[10px] uppercase opacity-40">نسبة الإنجاز</p>
            </div>
        </div>
        <div class="text-end">
            <h1 class="text-3xl font-bold tracking-tighter" style="color: #a5b4fc;">ASTRA <span class="text-sm opacity-30" id="mode-title">TOOL</span></h1>
        </div>
    </header>

    <main class="max-w-6xl mx-auto">
        
        <!-- واجهة الساعة (Timer View) -->
        <div id="timer-view" class="hidden flex flex-col items-center justify-center py-10 animate-in fade-in duration-500">
            <div class="glass-card p-12 rounded-[3rem] flex flex-col items-center w-full max-w-md">
                <h3 class="text-xl opacity-50 mb-8 tracking-widest">مؤقت التركيز</h3>
                
                <div class="timer-ring mb-10" id="timerProgress">
                    <div class="timer-display" id="time">25:00</div>
                </div>

                <div class="flex gap-4 mb-10">
                    <button onclick="toggleTimer()" id="startBtn" class="bg-indigo-600 hover:bg-indigo-500 px-10 py-4 rounded-2xl font-bold text-lg transition-all active:scale-95 shadow-lg shadow-indigo-500/20">ابدأ</button>
                    <button onclick="resetTimer()" class="p-4 glass-card rounded-2xl hover:bg-white/10">🔄</button>
                </div>

                <div class="grid grid-cols-2 gap-3 w-full">
                    <button onclick="setTime(25)" class="p-3 glass-card rounded-xl text-xs hover:bg-white/10">دراسة 25د</button>
                    <button onclick="setTime(5)" class="p-3 glass-card rounded-xl text-xs hover:bg-white/10">راحة 5د</button>
                </div>
            </div>
        </div>

        <!-- واجهة المصفوفة (Matrix View) -->
        <div id="matrix-view" class="hidden animate-in fade-in duration-500">
            <div class="flex flex-col lg:flex-row gap-4 p-2 glass-card rounded-3xl mb-8 items-center">
                <input type="text" id="taskInput" class="bg-transparent flex-grow p-4 outline-none text-lg text-white w-full" placeholder="أدخل مهمة جديدة...">
                <div class="flex gap-2 w-full lg:w-auto">
                    <select id="quadSelect" class="bg-indigo-900/40 text-white rounded-2xl px-4 py-4 outline-none border border-white/10 text-sm">
                        <option value="do">عاجل وهام</option>
                        <option value="schedule">خطط لها</option>
                        <option value="delegate">فوّضها</option>
                        <option value="delete">احذفها</option>
                    </select>
                    <button onclick="addTask()" class="bg-indigo-600 px-8 py-4 rounded-2xl font-bold whitespace-nowrap">إضافة</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="matrixGrid">
                <div class="glass-card p-6 rounded-3xl quadrant q-do">
                    <h3 class="text-red-400 font-bold mb-4 flex items-center gap-2"><span>🔴</span> افعل الآن</h3>
                    <div id="taskList-do" class="space-y-3"></div>
                </div>
                <div class="glass-card p-6 rounded-3xl quadrant q-schedule">
                    <h3 class="text-blue-400 font-bold mb-4 flex items-center gap-2"><span>🔵</span> خطط لها</h3>
                    <div id="taskList-schedule" class="space-y-3"></div>
                </div>
                <div class="glass-card p-6 rounded-3xl quadrant q-delegate">
                    <h3 class="text-orange-400 font-bold mb-4 flex items-center gap-2"><span>🟠</span> فوّضها</h3>
                    <div id="taskList-delegate" class="space-y-3"></div>
                </div>
                <div class="glass-card p-6 rounded-3xl quadrant q-delete">
                    <h3 class="text-gray-400 font-bold mb-4 flex items-center gap-2"><span>⚪</span> احذفها</h3>
                    <div id="taskList-delete" class="space-y-3"></div>
                </div>
            </div>
        </div>

    </main>

    <script>
        // نظام التبديل الذكي
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode') || 'matrix';

        window.onload = () => {
            if (mode === 'timer') {
                document.getElementById('timer-view').classList.remove('hidden');
                document.getElementById('matrix-stats').classList.add('hidden');
                document.getElementById('mode-title').innerText = "TIMER";
            } else {
                document.getElementById('matrix-view').classList.remove('hidden');
                document.getElementById('mode-title').innerText = "MATRIX";
                renderTasks();
            }
        };

        // --- كود الساعة (Timer) ---
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let timerInterval = null;

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const secs = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('time').innerText = `${mins}:${secs}`;
            const progress = ((totalTime - timeLeft) / totalTime) * 100;
            document.getElementById('timerProgress').style.setProperty('--progress', `${progress}%`);
        }

        function toggleTimer() {
            const btn = document.getElementById('startBtn');
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                btn.innerText = "استئناف";
            } else {
                btn.innerText = "إيقاف";
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        alert("انتهى الوقت!");
                    }
                }, 1000);
            }
        }

        function setTime(m) {
            totalTime = m * 60;
            timeLeft = totalTime;
            clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById('startBtn').innerText = "ابدأ";
            updateTimerDisplay();
        }

        function resetTimer() { setTime(totalTime / 60); }

        // --- كود المصفوفة (Matrix) ---
        let tasks = JSON.parse(localStorage.getItem('astra_matrix_tasks')) || [];

        function renderTasks() {
            const listIds = ['do', 'schedule', 'delegate', 'delete'];
            listIds.forEach(id => document.getElementById('taskList-' + id).innerHTML = '');
            
            tasks.forEach((task, index) => {
                const list = document.getElementById('taskList-' + task.quadrant);
                const div = document.createElement('div');
                div.className = `glass-card p-4 rounded-2xl flex items-center justify-between ${task.completed ? 'opacity-40' : ''}`;
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})" class="w-5 h-5 accent-indigo-500">
                        <span class="text-sm ${task.completed ? 'line-through' : ''}">${task.text}</span>
                    </div>
                    <button onclick="deleteTask(${index})" class="text-red-400 opacity-50 hover:opacity-100">✕</button>
                `;
                list.appendChild(div);
            });
            updateStats();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const quad = document.getElementById('quadSelect').value;
            if (input.value.trim()) {
                tasks.unshift({ text: input.value, completed: false, quadrant: quad });
                localStorage.setItem('astra_matrix_tasks', JSON.stringify(tasks));
                input.value = '';
                renderTasks();
            }
        }

        function toggleTask(index) {
            tasks[index].completed = !tasks[index].completed;
            localStorage.setItem('astra_matrix_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function deleteTask(index) {
            tasks.splice(index, 1);
            localStorage.setItem('astra_matrix_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function updateStats() {
            const done = tasks.filter(t => t.completed).length;
            const perc = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
            document.getElementById('completion-rate').innerText = perc + '%';
        }
    </script>
</body>
</html>
