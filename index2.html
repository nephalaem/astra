<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra Matrix - Unified Theme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* سيتم تحديث هذا المتغير من الـ LocalStorage فوراً */
            --primary-color: #6366f1; 
        }

        body { 
            background: #000; 
            background-image: radial-gradient(circle at top right, #1a1a2e, #000);
            background-attachment: fixed; 
            min-height: 100vh; 
            font-family: 'Tajawal', sans-serif;
            color: white;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .glass-card { 
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }

        /* تنسيقات الثيم الموحد */
        .text-primary { color: var(--primary-color) !important; }
        .bg-primary { background-color: var(--primary-color) !important; }
        .border-primary { border-color: var(--primary-color) !important; }
        .svg-primary { stroke: var(--primary-color) !important; }
        
        #add-btn {
            background-color: var(--primary-color) !important;
            box-shadow: 0 10px 20px -5px var(--primary-color);
        }

        /* تنسيق دوائر الثيم (الـ 15 ثيم) */
        .theme-circle {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .theme-circle:hover { transform: scale(1.2); }
        .theme-circle.active { border-color: white; transform: scale(1.2); }

        /* تنسيق المصفوفة - تم إزالة الألوان الخاصة بكل مربع لتتبع الثيم المختار */
        .matrix-quad {
            border-top: 2px solid var(--primary-color);
            transition: all 0.3s ease;
        }

        .task-item {
            transition: all 0.3s ease;
            border-right: 3px solid var(--primary-color);
        }

        /* إخفاء واجهة الإعدادات افتراضياً */
        #settings-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
        }
    </style>
    
    <script>
        // منع الوميض: تطبيق الثيم قبل تحميل الـ body
        (function() {
            const saved = localStorage.getItem('astra_global_theme');
            if (saved) {
                document.documentElement.style.setProperty('--primary-color', saved);
            }
        })();
    </script>
</head>
<body>

    <!-- Header -->
    <header class="max-w-4xl mx-auto flex justify-between items-center mb-8">
        <div class="flex items-center gap-4">
            <button onclick="toggleSettings()" class="p-3 glass-card rounded-2xl hover:bg-white/10 transition-all">
                <svg class="w-6 h-6 svg-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </button>
            <h1 class="text-3xl font-black tracking-tighter text-primary">ASTRA</h1>
        </div>
        
        <div class="text-right">
            <p class="text-[10px] opacity-40 uppercase tracking-widest">معدل الإنجاز</p>
            <span id="comp-rate" class="text-2xl font-bold">0%</span>
        </div>
    </header>

    <!-- Settings Modal (كما في الصورة الثانية) -->
    <div id="settings-modal" onclick="toggleSettings()">
        <div class="glass-card p-8 rounded-[32px] max-w-sm w-full m-4" onclick="event.stopPropagation()">
            <h2 class="text-xl font-bold mb-6 text-center">اختر السمة (15 ثيم)</h2>
            <div class="grid grid-cols-5 gap-4 mb-8 justify-items-center" id="theme-grid">
                <!-- سيتم توليد الـ 15 لون هنا -->
            </div>
            
            <div class="space-y-4">
                <div class="flex justify-between items-center p-3 glass-card rounded-xl">
                    <span class="text-sm">لغة التطبيق</span>
                    <span class="text-primary font-bold">العربية</span>
                </div>
                <button onclick="clearTasks()" class="w-full p-3 bg-red-500/10 text-red-400 rounded-xl text-sm hover:bg-red-500/20 transition-all">
                    مسح جميع المهام
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content (المصفوفة) -->
    <main class="max-w-4xl mx-auto">
        <!-- Input Area -->
        <div class="glass-card p-3 rounded-2xl mb-8 flex flex-col sm:flex-row gap-2">
            <input type="text" id="taskInput" class="bg-transparent flex-grow p-3 outline-none text-white placeholder:text-white/20" placeholder="مهمة جديدة...">
            <div class="flex gap-2">
                <select id="quadSelect" class="bg-white/5 border-none px-4 rounded-xl text-xs outline-none">
                    <option value="do">عاجل وهام</option>
                    <option value="schedule">خطط لها</option>
                    <option value="delegate">فوّضها</option>
                    <option value="delete">احذفها</option>
                </select>
                <button onclick="addTask()" id="add-btn" class="px-8 py-3 rounded-xl font-bold text-white">إضافة</button>
            </div>
        </div>

        <!-- Matrix Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="glass-card p-5 rounded-3xl matrix-quad" id="quad-do">
                <h3 class="text-primary font-bold mb-4 text-xs">🔴 افعل الآن (DO)</h3>
                <div id="list-do" class="space-y-2 min-h-[100px]"></div>
            </div>
            <div class="glass-card p-5 rounded-3xl matrix-quad" id="quad-schedule">
                <h3 class="text-primary font-bold mb-4 text-xs">🔵 خطط لها (SCHEDULE)</h3>
                <div id="list-schedule" class="space-y-2 min-h-[100px]"></div>
            </div>
            <div class="glass-card p-5 rounded-3xl matrix-quad" id="quad-delegate">
                <h3 class="text-primary font-bold mb-4 text-xs">🟠 فوّضها (DELEGATE)</h3>
                <div id="list-delegate" class="space-y-2 min-h-[100px]"></div>
            </div>
            <div class="glass-card p-5 rounded-3xl matrix-quad" id="quad-delete">
                <h3 class="text-primary font-bold mb-4 text-xs">⚪ احذفها (DELETE)</h3>
                <div id="list-delete" class="space-y-2 min-h-[100px]"></div>
            </div>
        </div>
    </main>

    <script>
        // الألوان الـ 15 المقترحة (كما في الصورة)
        const colors = [
            '#ec4899', '#ef4444', '#22c55e', '#000000', '#3b82f6',
            '#f472b6', '#84cc16', '#06b6d4', '#6366f1', '#111827',
            '#60a5fa', '#374151', '#fb7185', '#a855f7', '#10b981'
        ];

        let tasks = JSON.parse(localStorage.getItem('astra_tasks')) || [];

        // توليد شبكة الألوان في الإعدادات
        const themeGrid = document.getElementById('theme-grid');
        colors.forEach(color => {
            const dot = document.createElement('div');
            dot.className = 'theme-circle';
            dot.style.backgroundColor = color;
            dot.onclick = () => applyTheme(color);
            dot.setAttribute('data-color', color);
            themeGrid.appendChild(dot);
        });

        function applyTheme(color) {
            document.documentElement.style.setProperty('--primary-color', color);
            localStorage.setItem('astra_global_theme', color);
            
            // تحديث الشكل النشط
            document.querySelectorAll('.theme-circle').forEach(d => {
                d.classList.toggle('active', d.getAttribute('data-color') === color);
            });
        }

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function renderTasks() {
            ['do', 'schedule', 'delegate', 'delete'].forEach(id => document.getElementById('list-' + id).innerHTML = '');

            tasks.forEach((t, i) => {
                const list = document.getElementById('list-' + t.quadrant);
                const item = document.createElement('div');
                item.className = `task-item glass-card p-3 rounded-xl flex items-center justify-between ${t.completed ? 'opacity-30' : ''}`;
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${i})" class="accent-primary">
                        <span class="text-sm">${t.text}</span>
                    </div>
                    <button onclick="deleteTask(${i})" class="opacity-20 hover:opacity-100">✕</button>
                `;
                list.appendChild(item);
            });

            const done = tasks.filter(t => t.completed).length;
            document.getElementById('comp-rate').innerText = (tasks.length ? Math.round((done / tasks.length) * 100) : 0) + '%';
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            if (input.value.trim()) {
                tasks.unshift({ text: input.value.trim(), quadrant: document.getElementById('quadSelect').value, completed: false });
                input.value = '';
                save();
            }
        }

        function toggleTask(i) { tasks[i].completed = !tasks[i].completed; save(); }
        function deleteTask(i) { tasks.splice(i, 1); save(); }
        function clearTasks() { if(confirm('هل أنت متأكد؟')) { tasks = []; save(); toggleSettings(); } }
        function save() { localStorage.setItem('astra_tasks', JSON.stringify(tasks)); renderTasks(); }

        window.onload = () => {
            const saved = localStorage.getItem('astra_global_theme') || '#6366f1';
            applyTheme(saved);
            renderTasks();
        };
    </script>
</body>
</html>
