<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra V2 - Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); 
            background-attachment: fixed; 
            min-height: 100vh; 
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        
        /* تصميم المؤقت الدائري المطور */
        .timer-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .timer-svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }
        .timer-bg { 
            fill: none; 
            stroke: rgba(255,255,255,0.05); 
            stroke-width: 6; 
        }
        .timer-progress {
            fill: none;
            stroke: #6366f1;
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease;
        }
        .timer-text {
            position: absolute;
            font-family: 'monospace';
            font-size: 3.5rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }

        .tab-btn.active { 
            background: rgba(99, 102, 241, 0.3); 
            border-color: rgba(99, 102, 241, 0.6); 
            color: white; 
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
        }
        .hidden { display: none !important; }
        .quadrant { transition: all 0.3s ease; min-height: 250px; }
        
        /* تلوين المهام عند الانتهاء */
        .task-done { opacity: 0.3; filter: grayscale(1); }
    </style>
</head>
<body class="text-white p-4 md:p-10">

    <!-- القائمة العلوية للتبديل السريع -->
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6 mb-12">
        <div class="flex items-center gap-4">
            <a href="index.html" class="p-3 glass-card rounded-2xl hover:bg-white/10 transition-all text-white/50 hover:text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </a>
            <div class="flex glass-card p-1 rounded-2xl border border-white/5">
                <button onclick="switchMode('matrix')" id="btn-matrix" class="tab-btn px-6 py-2 rounded-xl text-sm font-medium transition-all">المصفوفة</button>
                <button onclick="switchMode('timer')" id="btn-timer" class="tab-btn px-6 py-2 rounded-xl text-sm font-medium transition-all">الساعة</button>
            </div>
        </div>

        <div class="text-center md:text-end">
            <h1 class="text-4xl font-bold tracking-tighter" style="color: #a5b4fc;">ASTRA <span class="text-sm opacity-20">TOOLS</span></h1>
            <p id="completion-label" class="text-[10px] uppercase opacity-40 tracking-widest mt-1">نسبة الإنجاز: <span id="completion-rate">0%</span></p>
        </div>
    </div>

    <main class="max-w-6xl mx-auto">
        
        <!-- واجهة الساعة (Timer View) -->
        <div id="timer-view" class="hidden flex flex-col items-center justify-center py-4 scale-in">
            <div class="glass-card p-8 md:p-12 rounded-[3rem] flex flex-col items-center w-full max-w-md shadow-2xl">
                <h2 class="text-xl font-medium mb-8 opacity-40 tracking-[0.2em]">FOCUS SESSION</h2>
                
                <div class="timer-container mb-10">
                    <svg class="timer-svg" viewBox="0 0 100 100">
                        <circle class="timer-bg" cx="50" cy="50" r="45"></circle>
                        <circle id="progress-circle" class="timer-progress" cx="50" cy="50" r="45" stroke-dasharray="283" stroke-dashoffset="0"></circle>
                    </svg>
                    <div class="timer-text" id="time-display">25:00</div>
                </div>

                <div class="flex gap-4 mb-10">
                    <button onclick="toggleTimer()" id="startBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-10 py-4 rounded-2xl font-bold text-lg transition-all active:scale-95 shadow-lg shadow-indigo-600/20">ابدأ</button>
                    <button onclick="resetTimer()" class="p-4 glass-card rounded-2xl hover:bg-white/10 transition-colors">🔄</button>
                </div>

                <div class="grid grid-cols-2 gap-3 w-full">
                    <button onclick="setTime(25)" class="py-3 glass-card rounded-xl text-xs hover:bg-white/5 transition-colors">تركيز (25د)</button>
                    <button onclick="setTime(5)" class="py-3 glass-card rounded-xl text-xs hover:bg-white/5 transition-colors">راحة (5د)</button>
                </div>
            </div>
        </div>

        <!-- واجهة المصفوفة (Matrix View) -->
        <div id="matrix-view" class="hidden">
            <div class="glass-card p-2 rounded-2xl mb-8 flex flex-col md:flex-row items-center gap-2">
                <input type="text" id="taskInput" class="bg-transparent flex-grow p-4 outline-none text-white placeholder:text-white/20" placeholder="أدخل مهمة جديدة...">
                <div class="flex gap-2 w-full md:w-auto">
                    <select id="quadSelect" class="bg-indigo-900/40 text-white rounded-xl px-4 py-3 outline-none border border-white/10 text-xs cursor-pointer">
                        <option value="do">عاجل وهام</option>
                        <option value="schedule">خطط لها</option>
                        <option value="delegate">فوّضها</option>
                        <option value="delete">احذفها</option>
                    </select>
                    <button onclick="addTask()" class="bg-indigo-600 px-8 py-3 rounded-xl font-bold text-sm whitespace-nowrap hover:bg-indigo-500 transition-all">إضافة</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass-card p-6 rounded-3xl quadrant q-do border-r-4 border-r-red-500/50">
                    <h3 class="text-red-400 font-bold mb-4 flex items-center gap-2"><span>🔴</span> افعل الآن</h3>
                    <div id="taskList-do" class="space-y-3"></div>
                </div>
                <div class="glass-card p-6 rounded-3xl quadrant q-schedule border-r-4 border-r-blue-500/50">
                    <h3 class="text-blue-400 font-bold mb-4 flex items-center gap-2"><span>🔵</span> خطط لها</h3>
                    <div id="taskList-schedule" class="space-y-3"></div>
                </div>
                <div class="glass-card p-6 rounded-3xl quadrant q-delegate border-r-4 border-r-orange-500/50">
                    <h3 class="text-orange-400 font-bold mb-4 flex items-center gap-2"><span>🟠</span> فوّضها</h3>
                    <div id="taskList-delegate" class="space-y-3"></div>
                </div>
                <div class="glass-card p-6 rounded-3xl quadrant q-delete border-r-4 border-r-gray-500/50">
                    <h3 class="text-gray-400 font-bold mb-4 flex items-center gap-2"><span>⚪</span> احذفها</h3>
                    <div id="taskList-delete" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- إدارة الأوضاع ---
        let currentMode = new URLSearchParams(window.location.search).get('mode') || 'matrix';

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('matrix-view').classList.toggle('hidden', mode !== 'matrix');
            document.getElementById('timer-view').classList.toggle('hidden', mode !== 'timer');
            document.getElementById('completion-label').classList.toggle('hidden', mode !== 'matrix');
            
            document.getElementById('btn-matrix').classList.toggle('active', mode === 'matrix');
            document.getElementById('btn-timer').classList.toggle('active', mode === 'timer');
            
            if (mode === 'matrix') renderTasks();
        }

        // --- كود الساعة (Timer Logic) ---
        let timeLeft = 25 * 60;
        let totalTime = 25 * 60;
        let timerInterval = null;
        const circle = document.getElementById('progress-circle');
        const circumference = 2 * Math.PI * 45;

        // تهيئة الدائرة
        circle.style.strokeDasharray = `${circumference} ${circumference}`;

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const secs = (timeLeft % 60).toString().padStart(2, '0');
            document.getElementById('time-display').innerText = `${mins}:${secs}`;
            
            const offset = circumference - (timeLeft / totalTime) * circumference;
            circle.style.strokeDashoffset = offset;
        }

        function toggleTimer() {
            const btn = document.getElementById('startBtn');
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                btn.innerText = "استئناف";
                btn.classList.replace('bg-rose-600', 'bg-indigo-600');
            } else {
                btn.innerText = "إيقاف";
                btn.classList.replace('bg-indigo-600', 'bg-rose-600');
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        btn.innerText = "ابدأ";
                        alert("انتهى الوقت!");
                        resetTimer();
                    }
                }, 1000);
            }
        }

        function setTime(m) {
            totalTime = m * 60;
            timeLeft = totalTime;
            if(timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            document.getElementById('startBtn').innerText = "ابدأ";
            document.getElementById('startBtn').classList.replace('bg-rose-600', 'bg-indigo-600');
            updateTimerDisplay();
        }

        function resetTimer() { setTime(totalTime / 60); }

        // --- كود المصفوفة (Matrix Logic) ---
        let tasks = JSON.parse(localStorage.getItem('astra_matrix_tasks')) || [];

        function renderTasks() {
            const ids = ['do', 'schedule', 'delegate', 'delete'];
            ids.forEach(id => {
                const el = document.getElementById('taskList-' + id);
                if(el) el.innerHTML = '';
            });
            
            tasks.forEach((task, index) => {
                const list = document.getElementById('taskList-' + task.quadrant);
                if (!list) return;
                const div = document.createElement('div');
                div.className = `glass-card p-4 rounded-2xl flex items-center justify-between group transition-all ${task.completed ? 'task-done' : ''}`;
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})" class="w-5 h-5 accent-indigo-500 cursor-pointer">
                        <span class="text-sm ${task.completed ? 'line-through opacity-50' : ''}">${task.text}</span>
                    </div>
                    <button onclick="deleteTask(${index})" class="text-white/20 hover:text-red-400 transition-colors">✕</button>
                `;
                list.appendChild(div);
            });
            updateStats();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const quad = document.getElementById('quadSelect').value;
            if (input.value.trim()) {
                tasks.unshift({ text: input.value, completed: false, quadrant: quad });
                saveAndRender();
                input.value = '';
            }
        }

        function toggleTask(index) { tasks[index].completed = !tasks[index].completed; saveAndRender(); }
        function deleteTask(index) { tasks.splice(index, 1); saveAndRender(); }
        function saveAndRender() {
            localStorage.setItem('astra_matrix_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function updateStats() {
            const done = tasks.filter(t => t.completed).length;
            const perc = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
            const rateEl = document.getElementById('completion-rate');
            if(rateEl) rateEl.innerText = perc + '%';
        }

        // بدء التشغيل
        window.addEventListener('DOMContentLoaded', () => {
            switchMode(currentMode);
            updateTimerDisplay();
        });
    </script>
</body>
</html>
